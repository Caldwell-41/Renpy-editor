<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark}html,body{margin:0;background:transparent;color:var(--foreground);font-family:var(--font-sans,system-ui)}
/* Draft A v2 only. No production selector changes. */
.cp2-summary{--cp2-bg:var(--surface-app,#22211f);--cp2-border:var(--border-normal,#48473e);--cp2-text:var(--text-primary,#eeece6);--cp2-muted:var(--text-secondary,#c4bfb1);--cp2-unknown:var(--status-partial,#e4bf7e);box-sizing:border-box;width:100%;height:100%;min-width:0;min-height:0;display:grid;grid-template-columns:194px minmax(0,1fr);background:var(--cp2-bg);color:var(--cp2-text);font:12px/1.4 var(--font-ui,system-ui);text-align:left;container-type:inline-size}
.cp2-summary *{box-sizing:border-box}
.cp2-stage{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:10px 12px;border-right:1px solid var(--cp2-border);background:#17191f;overflow:auto}
.cp2-stage p{margin:0;font-size:11px;line-height:1.35;overflow-wrap:anywhere}
.cp2-character-unknown,.cp2-unknown,.cp2-condition{color:var(--cp2-unknown)}
.cp2-background-unknown,.cp2-policy,.cp2-number{color:var(--cp2-muted)}
.cp2-scroll{min-width:0;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:4px 10px}
.cp2-scroll:focus-visible{outline:2px solid var(--focus-ring,#d7a078);outline-offset:-2px}
.cp2-prompt{display:flex;align-items:baseline;gap:8px;overflow-wrap:anywhere}
.cp2-speaker{flex:none;font-weight:650}
.cp2-picked{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:2px;font-size:11px;line-height:1.4}
.cp2-options{list-style:none;margin:4px 0 0;padding:0}
.cp2-scroll>.cp2-options:first-child{margin-top:0}
.cp2-option{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;align-items:baseline;margin:0;padding:1px 0;border-top:1px solid var(--cp2-border);overflow-wrap:anywhere}
.cp2-option:has(.cp2-condition){grid-template-columns:18px minmax(0,1fr) auto}
.cp2-number{font:11px/1.5 var(--font-source,monospace)}
.cp2-condition{font-size:11px;line-height:1.4}
.cp2-summary ::-webkit-scrollbar{width:7px;height:7px}
.cp2-summary ::-webkit-scrollbar-thumb{background:#8d887b}
.cp2-summary ::-webkit-scrollbar-track{background:var(--cp2-bg)}
@container(max-width:510px){.cp2-stage{padding:8px;font-size:11px}.cp2-option:has(.cp2-condition){grid-template-columns:18px minmax(0,1fr)}.cp2-condition{grid-column:2}}
@media(max-width:600px){.cp2-summary{grid-template-columns:125px minmax(0,1fr)}}

.review-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin:0 0 8px;font-size:12px}.review-controls label{display:flex;align-items:center;gap:6px}.review-controls select{font:inherit;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);padding:4px;max-width:100%}.story-context{display:block;width:100%;height:auto}.detail-label{font-size:13px;font-weight:600;margin:16px 0 8px}#preview-detail{height:110px;border:1px solid var(--border);overflow:hidden}.cp2-summary{--cp2-bg:#22211f;--cp2-border:#48473e;--cp2-text:#eeece6;--cp2-muted:#c4bfb1;--cp2-unknown:#e4bf7e;--font-ui:var(--font-sans,system-ui)}
</style></head><body>

<p class="detail-label">Preview detail</p>
<div class="review-controls"><label>Sample <select id="review-sample"><option value="duplicate">Duplicate captions + narration</option><option value="character">Character prompt</option><option value="long">Long prompt + options</option><option value="none">No prompt</option></select></label></div>
<div id="preview-detail"></div>
<script>(function() {
	//#region app/design-lab/screens/choice-preview-correction/summary.ts
	var states = {
		duplicate: {
			speaker: "Narration",
			prompt: "Choose independently",
			picked: "Hide picked",
			options: [
				"Same",
				"Same",
				"Locked"
			]
		},
		character: {
			speaker: "Bec",
			prompt: "The last service leaves in a minute. Are you coming with me?",
			picked: "Mark picked",
			options: [
				"Get on",
				"Stay on the platform",
				"Show the gold ticket"
			]
		},
		long: {
			speaker: "Bec",
			prompt: "Before the last service leaves, tell me whether you want to follow the lamplighter or wait here until someone explains the new stop on the timetable.",
			picked: "Hide picked",
			options: [
				"Go",
				"Stay on the platform until the station master returns with the timetable and explains why the last stop has changed tonight.",
				"Ask Bec to wait while you cross the platform, find the lamplighter, and ask whether the gold ticket is valid for the service after midnight."
			]
		},
		none: {
			speaker: "",
			prompt: "",
			picked: "Show normally",
			options: [
				"Get on",
				"Wait",
				"Leave"
			]
		}
	};
	//#endregion
	//#region app/design-lab/screens/choice-preview-correction/dock-v2/summary.ts
	function element(tag, className, text) {
		const node = document.createElement(tag);
		node.className = className;
		if (text) node.textContent = text;
		return node;
	}
	function summary(state) {
		const sample = states[state];
		const root = element("section", "cp2-summary");
		root.setAttribute("aria-label", "Choice summary");
		root.dataset.state = state;
		const stage = element("div", "cp2-stage");
		stage.setAttribute("aria-label", "Game stage, state unknown");
		stage.append(element("p", "cp2-character-unknown", "Other character state may be unknown"));
		const background = element("p", "cp2-background-unknown", "Background unknown");
		background.title = "Background unknown after code or unevaluated flow";
		stage.append(background);
		const scroll = element("div", "cp2-scroll");
		scroll.tabIndex = 0;
		scroll.setAttribute("role", "region");
		scroll.setAttribute("aria-label", "Choice prompt and options. Scroll to read more.");
		if (sample.prompt) {
			const prompt = element("div", "cp2-prompt");
			prompt.append(element("strong", "cp2-speaker", sample.speaker));
			prompt.append(element("span", "cp2-prompt-text", sample.prompt));
			scroll.append(prompt);
		}
		if (sample.picked !== "Show normally") {
			const picked = element("div", "cp2-picked");
			picked.append(element("span", "cp2-unknown", "Picked state unknown"));
			picked.append(element("span", "cp2-policy", sample.picked));
			scroll.append(picked);
		}
		const options = element("ol", "cp2-options");
		options.setAttribute("aria-label", "Choice options, read only");
		sample.options.forEach((caption, index) => {
			const option = element("li", "cp2-option");
			option.dataset.optionIndex = String(index + 1);
			option.append(element("span", "cp2-number", String(index + 1)));
			option.append(element("span", "cp2-caption", caption));
			if (index === 2) {
				const condition = element("span", "cp2-condition", "Condition unknown");
				condition.title = "If false: Show disabled";
				condition.setAttribute("aria-label", "Condition unknown. If false: Show disabled.");
				option.append(condition);
			}
			options.append(option);
		});
		scroll.append(options);
		root.append(stage, scroll);
		return root;
	}
	//#endregion
	//#region app/design-lab/screens/choice-preview-correction/dock-v2/review.ts
	var context = document.querySelector("#story-context");
	var size = document.querySelector("#review-size");
	var sample = document.querySelector("#review-sample");
	var detail = document.querySelector("#preview-detail");
	context.src = context.dataset.wide;
	size.addEventListener("change", () => {
		context.src = context.dataset[size.value];
		context.alt = `Draft A v2 in the current Story page at ${size.value === "wide" ? "1100 by 720" : "720 by 850"}.`;
	});
	function draw() {
		detail.replaceChildren(summary(sample.value));
	}
	sample.addEventListener("change", draw);
	draw();
	//#endregion
})();
</script></body></html>
