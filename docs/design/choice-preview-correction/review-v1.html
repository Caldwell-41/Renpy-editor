<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark}html,body{margin:0;background:transparent;color:var(--foreground);font-family:var(--font-sans,system-ui)}
/* Scoped draft. Production styles remain unchanged. */
.cpc-summary { --cpc-bg:var(--surface-app,#22211f);--cpc-panel:var(--surface-panel,#292823);--cpc-border:var(--border-normal,#48473e);--cpc-text:var(--text-primary,#eeece6);--cpc-muted:var(--text-secondary,#c4bfb1);--cpc-unknown:var(--status-partial,#e4bf7e);box-sizing:border-box;width:100%;height:100%;min-width:0;min-height:0;display:grid;color:var(--cpc-text);background:var(--cpc-bg);font:12px/1.4 var(--font-ui,system-ui);text-align:left; }
.cpc-summary * {box-sizing:border-box;}
.cpc-summary :focus-visible {outline:2px solid var(--focus-ring,#d7a078);outline-offset:-2px;}
.cpc-summary .cpc-context {min-width:0;padding:4px 10px;}
.cpc-prompt {display:flex;align-items:baseline;gap:8px;overflow-wrap:anywhere;}
.cpc-speaker {font-weight:650;flex:none;}
.cpc-no-prompt,.cpc-condition,.cpc-picked {color:var(--cpc-muted);}
.cpc-picked {font-size:11px;margin-top:2px;}
.cpc-unknown {color:var(--cpc-unknown);font-weight:400;}
.cpc-options {list-style:none;padding:0 10px 6px;margin:0;min-width:0;}
.cpc-option {display:grid;grid-template-columns:18px minmax(0,1fr) minmax(130px,42%);gap:6px;align-items:baseline;padding:1px 0;border-top:1px solid var(--cpc-border);overflow-wrap:anywhere;}
.cpc-number {font:11px/1.5 var(--font-source,monospace);color:var(--cpc-muted);}
.cpc-condition {font-size:10px;}
.cpc-notices {display:flex;flex-direction:column;gap:5px;color:var(--cpc-unknown);font-size:10px;line-height:1.3;overflow-wrap:anywhere;}
.cpc-background-unknown {color:var(--cpc-muted);}
.cpc-dock {grid-template-columns:194px minmax(0,1fr);}
.cpc-stage {background:#17191f;display:grid;align-content:center;padding:10px 12px;border-right:1px solid var(--cpc-border);}
.cpc-scroll {min-width:0;min-height:0;overflow:auto;scrollbar-gutter:stable;}
.cpc-summary ::-webkit-scrollbar {width:7px;height:7px;}
.cpc-summary ::-webkit-scrollbar-thumb {background:var(--cpc-border);}
.cpc-summary ::-webkit-scrollbar-track {background:var(--cpc-bg);}
.cpc-transcript .cpc-notices {border-top:1px solid var(--cpc-border);padding:5px 10px;flex-direction:row;gap:16px;}
.cpc-split {grid-template-columns:minmax(150px,36%) minmax(0,1fr);}
.cpc-split>.cpc-context {overflow:auto;border-right:1px solid var(--cpc-border);}
.cpc-split .cpc-prompt {display:block;}
.cpc-split .cpc-speaker {display:block;margin-bottom:2px;}
.cpc-split .cpc-notices {margin-top:7px;}
.cpc-split>.cpc-options {overflow:auto;scrollbar-gutter:stable;padding-top:3px;}
.cpc-split .cpc-option {grid-template-columns:18px minmax(0,1fr);}
.cpc-split .cpc-condition {grid-column:2;}
@media(max-width:600px){.cpc-dock{grid-template-columns:125px minmax(0,1fr)}.cpc-option{grid-template-columns:18px minmax(0,1fr)}.cpc-condition{grid-column:2}.cpc-transcript .cpc-notices{flex-direction:column;gap:3px}}

.cpc-review-controls{display:flex;gap:12px;align-items:center;font-size:12px;padding:0 0 8px}.cpc-review-controls select{background:var(--secondary);color:var(--foreground);border:1px solid var(--border);font:inherit;padding:4px;max-width:100%}.cpc-review-example{margin:0 0 18px;min-width:0}.cpc-review-example h3{font-size:14px;margin:8px 0 4px;font-weight:600}.cpc-review-example p{font-size:12px;line-height:1.5;margin:0 0 6px;color:var(--muted-foreground)}.cpc-review-frame{height:110px;border:1px solid var(--border);overflow:hidden}.cpc-summary{--cpc-bg:#22211f;--cpc-panel:#292823;--cpc-border:#48473e;--cpc-text:#eeece6;--cpc-muted:#c4bfb1;--cpc-unknown:#e4bf7e;--font-ui:var(--font-sans,system-ui)}
</style></head><body><div id="comparison"></div><script>(function() {
	//#region app/design-lab/screens/choice-preview-correction/summary.ts
	var states = {
		duplicate: {
			speaker: "Narration",
			prompt: "Choose independently",
			picked: "Hide picked",
			options: [
				"Same",
				"Same",
				"Locked"
			]
		},
		character: {
			speaker: "Bec",
			prompt: "The last service leaves in a minute. Are you coming with me?",
			picked: "Mark picked",
			options: [
				"Get on",
				"Stay on the platform",
				"Show the gold ticket"
			]
		},
		long: {
			speaker: "Bec",
			prompt: "Before the last service leaves, tell me whether you want to follow the lamplighter or wait here until someone explains the new stop on the timetable.",
			picked: "Hide picked",
			options: [
				"Go",
				"Stay on the platform until the station master returns with the timetable and explains why the last stop has changed tonight.",
				"Ask Bec to wait while you cross the platform, find the lamplighter, and ask whether the gold ticket is valid for the service after midnight."
			]
		},
		none: {
			speaker: "",
			prompt: "",
			picked: "Show normally",
			options: [
				"Get on",
				"Wait",
				"Leave"
			]
		}
	};
	function el(tag, className, text) {
		const node = document.createElement(tag);
		node.className = className;
		if (text) node.textContent = text;
		return node;
	}
	function summary(variant, state) {
		const sample = states[state];
		const root = el("section", `cpc-summary cpc-${variant}`);
		root.setAttribute("aria-label", "Illustrative Choice summary");
		root.dataset.variant = variant;
		root.dataset.state = state;
		const context = el("div", "cpc-context");
		context.tabIndex = 0;
		context.setAttribute("aria-label", "Prompt and preview state");
		const prompt = el("div", "cpc-prompt");
		prompt.append(el("strong", "cpc-speaker", sample.prompt ? sample.speaker : "Choice"));
		if (sample.prompt) prompt.append(el("span", "cpc-prompt-text", sample.prompt));
		else prompt.append(el("span", "cpc-no-prompt", "No prompt"));
		context.append(prompt);
		const picked = el("div", "cpc-picked");
		if (sample.picked !== "Show normally") picked.append(el("strong", "cpc-unknown", "Picked state unknown"), document.createTextNode(` · ${sample.picked}`));
		else picked.textContent = "Picked options · Show normally";
		context.append(picked);
		const notices = el("div", "cpc-notices");
		notices.append(el("span", "cpc-character-unknown", "Other character state may be unknown"));
		notices.append(el("span", "cpc-background-unknown", "Background unknown after code or unevaluated flow"));
		const options = el("ol", "cpc-options");
		options.tabIndex = 0;
		options.setAttribute("aria-label", "Option summary, not selectable");
		sample.options.forEach((text, index) => {
			const item = el("li", "cpc-option");
			item.dataset.optionIndex = String(index + 1);
			item.append(el("span", "cpc-number", String(index + 1)), el("span", "cpc-caption", text));
			const status = el("span", index === 2 ? "cpc-condition cpc-unknown" : "cpc-condition", index === 2 ? "Condition unknown · if false: Show disabled" : "No condition");
			item.append(status);
			options.append(item);
		});
		if (variant === "dock") {
			const stage = el("div", "cpc-stage");
			stage.append(notices);
			const text = el("div", "cpc-scroll");
			text.tabIndex = 0;
			text.setAttribute("aria-label", "Choice prompt and options");
			text.append(context, options);
			root.append(stage, text);
		} else if (variant === "transcript") {
			const text = el("div", "cpc-scroll");
			text.tabIndex = 0;
			text.setAttribute("aria-label", "Choice prompt, options and preview state");
			text.append(context, options, notices);
			root.append(text);
		} else {
			context.append(notices);
			root.append(context, options);
		}
		return root;
	}
	//#endregion
	//#region app/design-lab/screens/choice-preview-correction/review.ts
	var host = document.querySelector("#comparison");
	var controls = document.createElement("div");
	controls.className = "cpc-review-controls";
	var label = document.createElement("label");
	label.textContent = "Sample ";
	var select = document.createElement("select");
	select.setAttribute("aria-label", "Review sample");
	for (const [id, text] of Object.entries({
		duplicate: "Duplicate captions + narration",
		character: "Character prompt",
		long: "Long prompt + long/short options",
		none: "No prompt"
	})) {
		const option = document.createElement("option");
		option.value = id;
		option.textContent = text;
		select.append(option);
	}
	label.append(select);
	controls.append(label);
	host.append(controls);
	var samples = document.createElement("div");
	host.append(samples);
	function draw() {
		samples.replaceChildren();
		for (const [variant, title, note] of [
			[
				"dock",
				"A · Summary beside canvas",
				"Retains the 16:9 stage. The prompt and options share one scrolling column."
			],
			[
				"transcript",
				"B · Full-width summary",
				"Uses the Choice preview area for text. Scene notices follow the options in the same scroll."
			],
			[
				"split",
				"C · Prompt / options split",
				"Keeps the prompt and notices on the left. Options scroll independently on the right."
			]
		]) {
			const section = document.createElement("section");
			section.className = "cpc-review-example";
			const h = document.createElement("h3");
			h.textContent = title;
			const p = document.createElement("p");
			p.textContent = note;
			const frame = document.createElement("div");
			frame.className = "cpc-review-frame";
			frame.append(summary(variant, select.value));
			section.append(h, p, frame);
			samples.append(section);
		}
	}
	select.onchange = draw;
	draw();
	//#endregion
})();
</script></body></html>
