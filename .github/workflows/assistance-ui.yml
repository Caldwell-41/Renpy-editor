name: Studio assistance UI refinement
on:
  workflow_call:
    inputs:
      outcome:
        type: string
        default: assistance-ui
      expected_candidate:
        type: string
        default: ''
      excluded_selectors:
        type: boolean
        default: false
      ordinal:
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: assistance-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: Windows x64
          - runner: macos-26
            target: macOS ARM64
    name: Assistance UI — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected branch and finite fresh attempt
        id: selection
        shell: bash
        env:
          ORDINAL: ${{ inputs.ordinal }}
          OUTCOME: ${{ inputs.outcome }}
          EXPECTED_CANDIDATE: ${{ inputs.expected_candidate }}
          EXCLUDED_SELECTORS: ${{ inputs.excluded_selectors }}
        run: |
          set -euo pipefail
          if test "$OUTCOME" = walkthrough-redesign; then
            python app/scripts/check-redesign-evidence.py gate
          else
            test "$OUTCOME" = assistance-ui
            test "$GITHUB_REF" = refs/heads/codex/provider-qualification
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$ORDINAL" = 1 -o "$ORDINAL" = 2
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: assistance-ui-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: 'false'
      - name: Pinned dependencies and historical focused UI/service proof
        if: inputs.outcome == 'assistance-ui'
        shell: bash
        working-directory: app
        run: |
          mkdir -p "$RUNNER_TEMP/assistance-ui"
          npm install --global npm@11.9.0
          npm_cli="$(npm root --global)/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = 11.9.0
          node "$npm_cli" ci --ignore-scripts
          node "$npm_cli" run typecheck
          node "$npm_cli" run build:tests
          node --test --test-concurrency=1 dist-tests/tests/assistance-refinement.dom.test.js dist-tests/tests/ai-settings.dom.test.js dist-tests/tests/rewrite-ui.dom.test.js dist-tests/tests/reference-ui.dom.test.js dist-tests/tests/prompt-ui.dom.test.js > "$RUNNER_TEMP/assistance-ui/dom.log" 2>&1
          cat "$RUNNER_TEMP/assistance-ui/dom.log"
          python -c "import os,re,pathlib; s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'assistance-ui/dom.log').read_text(encoding='utf-8'); assert re.search(r'(?:ℹ|#) tests 32\s',s); assert re.search(r'(?:ℹ|#) pass 32\s',s); assert re.search(r'(?:ℹ|#) fail 0\s',s); assert re.search(r'(?:ℹ|#) skipped 0\s',s)"
          node "$npm_cli" run build
          export LOOMLIGHT_UI_OUTPUT="$RUNNER_TEMP/assistance-ui/browser"
          node node_modules/playwright/cli.js install chromium
          node tests/assistance-refinement.browser.mjs > "$RUNNER_TEMP/assistance-ui/browser.log" 2>&1
          cat "$RUNNER_TEMP/assistance-ui/browser.log"
          python -c "import os,json,pathlib; p=pathlib.Path(os.environ['LOOMLIGHT_UI_OUTPUT']); v=json.loads((p/'metrics.json').read_text()); assert len(v['receipts'])==36 and not v['errors']; assert all(not r['viewportOverflow'] for r in v['receipts']); assert len(list(p.glob('*.png')))==36"
          rustup toolchain install 1.90.0 --profile minimal
          export RUSTUP_TOOLCHAIN=1.90.0
          cargo build -p loomlight-desktop --locked --example rewrite-controller-driver
          driver=target/debug/examples/rewrite-controller-driver
          if test "$RUNNER_OS" = Windows; then driver="$driver.exe"; fi
          node tests/phase2-controller.dispatch.mjs "$driver" --selectable-integrated --game-output "$RUNNER_TEMP/assistance-ui/fixture-game.json" > "$RUNNER_TEMP/assistance-ui/controller.log" 2>&1
          cat "$RUNNER_TEMP/assistance-ui/controller.log"
          python -c "import os,pathlib; s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'assistance-ui/controller.log').read_text(encoding='utf-8'); assert 'PASS: same-project integrated selectable multi-operation/dependency-invalid zero writes/valid partial subset accepted once/custom preservation/Undo-Redo/export/project-process reopen' in s"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/assistance-ui"
      - name: Current harness regressions before expensive qualification
        id: redesign_harness
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.selection.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: bash
        run: python app/scripts/run-harness-checks.py --output "$RUNNER_TEMP/assistance-ui/harness"
      - name: Current redesign locked dependencies
        id: redesign_dependencies
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.selection.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assistance-ui"
          npm install --global npm@11.9.0
          npm_cli="$(npm root --global)/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = 11.9.0
          node "$npm_cli" ci --ignore-scripts
          echo "REDESIGN_NPM_CLI=$npm_cli" >> "$GITHUB_ENV"
      - name: Current redesign typecheck
        id: redesign_typecheck
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_dependencies.outcome == 'success' }}
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          node "$REDESIGN_NPM_CLI" run typecheck 2>&1 | tee "$RUNNER_TEMP/assistance-ui/typecheck.log"
      - name: Current redesign test compilation
        id: redesign_test_compile
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_dependencies.outcome == 'success' }}
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          node "$REDESIGN_NPM_CLI" run build:tests 2>&1 | tee "$RUNNER_TEMP/assistance-ui/test-compile.log"
      - name: Current redesign renderer and production probe consumers
        id: redesign_dom
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_test_compile.outcome == 'success' }}
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=tap dist-tests/tests/ai-settings.dom.test.js dist-tests/tests/reference-ui.dom.test.js dist-tests/tests/assistance-refinement.dom.test.js dist-tests/tests/rewrite-ui.dom.test.js dist-tests/tests/prompt-ui.dom.test.js dist-tests/tests/studio-request.dom.test.js dist-tests/tests/protocol.test.js dist-tests/tests/identity-probe.dom.test.js dist-tests/tests/windows-studio-probe.dom.test.js dist-tests/tests/selectable-native-sequence.dom.test.js dist-tests/tests/native-probe-driver.test.js dist-tests/tests/save-command.dom.test.js dist-tests/tests/supporting-authoring.dom.test.js dist-tests/tests/smoke-report.dom.test.js 2>&1 | tee "$RUNNER_TEMP/assistance-ui/dom.log"
          python scripts/check-redesign-evidence.py dom "$RUNNER_TEMP/assistance-ui/dom.log"
      - name: Current redesign renderer build
        id: redesign_build
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_dependencies.outcome == 'success' }}
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          node "$REDESIGN_NPM_CLI" run build 2>&1 | tee "$RUNNER_TEMP/assistance-ui/renderer-build.log"
      - name: Current redesign browser evidence
        id: redesign_browser
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_build.outcome == 'success' }}
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          export LOOMLIGHT_UI_OUTPUT="$RUNNER_TEMP/assistance-ui/browser"
          node node_modules/playwright/cli.js install chromium
          node tests/walkthrough-redesign.browser.mjs 2>&1 | tee "$RUNNER_TEMP/assistance-ui/browser.log"
          python scripts/check-redesign-evidence.py browser "$LOOMLIGHT_UI_OUTPUT"
      - name: Current redesign Rust toolchain
        id: redesign_rust
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.selection.outcome == 'success' }}
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Current redesign independent core service scopes
        id: redesign_core
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_rust.outcome == 'success' }}
        shell: bash
        working-directory: app
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assistance-ui"
          failed=0
          for scope in references::tests:: prompts::tests:: ai_profiles::tests::model_load_ studio_config::tests:: ai_request::model_settings_tests:: ai_request::model_readiness_tests:: ai_request::model_diagnostic_tests::; do
            name="${scope//::/-}"
            if cargo test -p loomlight-core --locked --lib "$scope" -- --list > "$RUNNER_TEMP/assistance-ui/$name-list.log" 2>&1 &&
               cargo test -p loomlight-core --locked --lib "$scope" -- --nocapture 2>&1 | tee "$RUNNER_TEMP/assistance-ui/$name.log" &&
               python scripts/check-redesign-evidence.py cargo "$RUNNER_TEMP/assistance-ui/$name.log" "$scope" "$RUNNER_TEMP/assistance-ui/$name-list.log"; then
              echo "$scope PASS"
            else
              cat "$RUNNER_TEMP/assistance-ui/$name-list.log"
              failed=1
            fi
          done
          test "$failed" = 0
      - name: Current redesign shared project context
        id: redesign_context
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_rust.outcome == 'success' }}
        shell: bash
        working-directory: app
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          set -euo pipefail
          cargo test -p loomlight-core --locked --lib shared_project_context -- --list > "$RUNNER_TEMP/assistance-ui/rewrite-list.log" 2>&1
          cargo test -p loomlight-core --locked --lib shared_project_context -- --nocapture 2>&1 | tee "$RUNNER_TEMP/assistance-ui/rewrite.log"
          python scripts/check-redesign-evidence.py cargo "$RUNNER_TEMP/assistance-ui/rewrite.log" shared_project_context "$RUNNER_TEMP/assistance-ui/rewrite-list.log"
      - name: Current redesign native worker regressions
        id: redesign_worker
        if: ${{ !cancelled() && inputs.outcome == 'walkthrough-redesign' && steps.redesign_rust.outcome == 'success' && steps.redesign_build.outcome == 'success' }}
        shell: bash
        working-directory: app
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          set -euo pipefail
          cargo test -p loomlight-desktop --locked --bin loomlight ai_requests::tests:: -- --list > "$RUNNER_TEMP/assistance-ui/request-host-list.log" 2>&1
          cargo test -p loomlight-desktop --locked --bin loomlight ai_requests::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/assistance-ui/request-host.log"
          python scripts/check-redesign-evidence.py cargo "$RUNNER_TEMP/assistance-ui/request-host.log" ai_requests::tests:: "$RUNNER_TEMP/assistance-ui/request-host-list.log"
          git diff --exit-code HEAD -- . ../.github/workflows ../scripts/validate.py ../.gitattributes
      - name: Summarize independent current redesign outcomes
        if: ${{ always() && inputs.outcome == 'walkthrough-redesign' }}
        shell: bash
        env:
          CHECK_STEPS: ${{ toJSON(steps) }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'assistance-ui'
          output.mkdir(parents=True, exist_ok=True)
          steps = json.loads(os.environ['CHECK_STEPS'])
          names = ('selection', 'node', 'redesign_harness', 'redesign_dependencies', 'redesign_typecheck', 'redesign_test_compile', 'redesign_dom', 'redesign_build', 'redesign_browser', 'redesign_rust', 'redesign_core', 'redesign_context', 'redesign_worker')
          results = {name: {key: steps.get(name, {}).get(key, 'not-run') for key in ('outcome', 'conclusion')} for name in names}
          (output / 'check-results.json').write_text(json.dumps(results, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join('- ' + name + ': ' + value['outcome'] for name, value in results.items()) + '\n')
          PY
      - name: Scan partial or complete current redesign evidence
        id: redesign-privacy
        if: ${{ always() && inputs.outcome == 'walkthrough-redesign' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assistance-ui"
          python app/scripts/check-redesign-evidence.py seal "$RUNNER_TEMP/assistance-ui"
          node app/scripts/scan-artifacts.mjs "$RUNNER_TEMP/assistance-ui"
      - name: Require complete current redesign source identity
        if: ${{ success() && inputs.outcome == 'walkthrough-redesign' }}
        shell: bash
        run: python app/scripts/check-redesign-evidence.py identity "$RUNNER_TEMP/assistance-ui/identity.json"
      - name: Retain actual candidate and partial or complete evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/assistance-ui"
          git rev-parse HEAD > "$RUNNER_TEMP/assistance-ui/candidate.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/assistance-ui/tree.txt"
          python -c "import hashlib,json,pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'assistance-ui'; (p/'manifest.json').write_text(json.dumps({str(f.relative_to(p)).replace(chr(92),'/'):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f.name!='manifest.json'},indent=2))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (inputs.outcome == 'assistance-ui' || steps.redesign-privacy.outcome == 'success') }}
        with:
          name: assistance-ui-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assistance-ui/
          if-no-files-found: error
          retention-days: 7
