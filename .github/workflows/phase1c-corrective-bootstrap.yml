name: Phase 1C corrective bootstrap

on:
  push:
    branches: [phase1c-corrective]
    paths:
      - .github/workflows/phase1c-corrective-bootstrap.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective
          fetch-depth: 0

      - name: Apply bounded Phase 1C corrective patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          data = """"""
          open('/tmp/phase1c-remediate.py', 'wb').write(gzip.decompress(base64.b64decode(data)))
          PY
          python3 /tmp/phase1c-remediate.py
          rm -f /tmp/phase1c-remediate.py

      - name: Select locked Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Select locked npm toolchain
        run: npm install --global npm@11.9.0

      - name: Install locked frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Validate frontend and protocol
        working-directory: app
        run: npm run check

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Format and check Rust
        working-directory: app
        run: |
          cargo fmt --all
          cargo fmt --check --all

      - name: Test corrective Rust core
        working-directory: app
        run: cargo test -p loomlight-core --locked -- --nocapture

      - name: Lint corrective Rust core
        working-directory: app
        run: cargo clippy -p loomlight-core --all-targets --locked -- -D warnings

      - name: Run repository validator
        run: python3 scripts/validate.py

      - name: Check diff hygiene
        run: git diff --check

      - name: Commit validated corrective work
        shell: bash
        run: |
          git rm .github/workflows/phase1c-corrective-bootstrap.yml
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "fix: harden Phase 1C lifecycle boundaries"
          git push origin HEAD:phase1c-corrective
