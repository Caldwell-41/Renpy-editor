name: Phase 1C target patch

on:
  push:
    branches: [phase1c-corrective-targets]
    paths:
      - .github/workflows/phase1c-target-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective-targets
          fetch-depth: 0
      - name: Apply target-specific corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lifecycle = Path('app/src-core/src/lifecycle.rs')
          text = lifecycle.read_text()
          old = '''        let parent = open_parent(&parent_path).unwrap();
        let token = uuid::Uuid::new_v4().to_string();
'''
          new = '''        let parent = open_parent(&parent_path).unwrap();
        let parent_path = parent.path.clone();
        let token = uuid::Uuid::new_v4().to_string();
'''
          if text.count(old) != 1:
              raise SystemExit('stage test setup not found exactly once')
          lifecycle.write_text(text.replace(old, new))

          renpy = Path('app/src-core/src/renpy.rs')
          text = renpy.read_text()
          old = '''    for key in [
        "PATH",
        "HOME",
        "USERPROFILE",
        "APPDATA",
        "LOCALAPPDATA",
        "SYSTEMROOT",
        "WINDIR",
        "COMSPEC",
        "PATHEXT",
        "TMPDIR",
        "TEMP",
        "TMP",
        "LANG",
        "LC_ALL",
        "LC_CTYPE",
    ] {
        if let Some(value) = std::env::var_os(key) {
            command.env(key, value);
        }
    }
}
'''
          new = '''    for key in [
        "PATH",
        "HOME",
        "USERPROFILE",
        "APPDATA",
        "LOCALAPPDATA",
        "SYSTEMROOT",
        "WINDIR",
        "COMSPEC",
        "PATHEXT",
        "TMPDIR",
        "TEMP",
        "TMP",
        "LANG",
        "LC_ALL",
        "LC_CTYPE",
    ] {
        if let Some(value) = std::env::var_os(key) {
            command.env(key, value);
        }
    }
    #[cfg(windows)]
    for key in [
        "ALLUSERSPROFILE",
        "COMMONPROGRAMFILES",
        "COMMONPROGRAMFILES(X86)",
        "COMMONPROGRAMW6432",
        "COMPUTERNAME",
        "DRIVERDATA",
        "HOMEDRIVE",
        "HOMEPATH",
        "NUMBER_OF_PROCESSORS",
        "OS",
        "PROCESSOR_ARCHITECTURE",
        "PROCESSOR_IDENTIFIER",
        "PROCESSOR_LEVEL",
        "PROCESSOR_REVISION",
        "PROGRAMDATA",
        "PROGRAMFILES",
        "PROGRAMFILES(X86)",
        "PROGRAMW6432",
        "PUBLIC",
        "SESSIONNAME",
        "SYSTEMDRIVE",
        "USERDOMAIN",
        "USERDOMAIN_ROAMINGPROFILE",
        "USERNAME",
    ] {
        if let Some(value) = std::env::var_os(key) {
            command.env(key, value);
        }
    }
}
'''
          if text.count(old) != 1:
              raise SystemExit('minimal RenPy environment helper not found exactly once')
          renpy.write_text(text.replace(old, new))
          PY
      - name: Format
        working-directory: app
        run: cargo fmt --all && cargo fmt --check --all
      - name: Run local core suite
        working-directory: app
        run: cargo test -p loomlight-core --locked
      - name: Commit source corrections
        shell: bash
        run: |
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add app/src-core/src/lifecycle.rs app/src-core/src/renpy.rs
          git diff --cached --check
          git commit -m "fix: reconcile Phase 1C target behavior"
          git push origin HEAD:phase1c-corrective-targets
