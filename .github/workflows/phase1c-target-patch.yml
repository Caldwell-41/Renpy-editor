name: Phase 1C target patch

on:
  push:
    branches: [phase1c-corrective-targets]
    paths:
      - .github/workflows/phase1c-target-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective-targets
          fetch-depth: 0
      - name: Normalize paths passed to Ren'Py
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          renpy = Path('app/src-core/src/renpy.rs')
          text = renpy.read_text()
          old = '        let mut value = vec![executable.into_os_string(), script.into_os_string()];\n'
          new = '        let mut value = vec![command_path(&executable), command_path(&script)];\n'
          if text.count(old) != 1:
              raise SystemExit('Windows launcher vector not found exactly once')
          text = text.replace(old, new)
          old = '        .args(args)\n        .current_dir(cwd)\n'
          new = '        .args(args)\n        .current_dir(command_path(cwd))\n'
          if text.count(old) != 1:
              raise SystemExit('process cwd not found exactly once')
          renpy.write_text(text.replace(old, new))
          PY
      - name: Format
        working-directory: app
        run: cargo fmt --all && cargo fmt --check --all
      - name: Run local core suite
        working-directory: app
        run: cargo test -p loomlight-core --locked
      - name: Commit source correction
        shell: bash
        run: |
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add app/src-core/src/renpy.rs
          git diff --cached --check
          git commit -m "fix: normalize Windows Ren'Py process paths"
          git push origin HEAD:phase1c-corrective-targets
