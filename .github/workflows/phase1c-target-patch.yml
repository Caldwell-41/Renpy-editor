name: Phase 1C target patch

on:
  push:
    branches: [phase1c-corrective-targets]
    paths:
      - .github/workflows/phase1c-target-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective-targets
          fetch-depth: 0
      - name: Remove diagnostic-era Windows environment expansion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          renpy = Path('app/src-core/src/renpy.rs')
          text = renpy.read_text()
          start = text.index('    #[cfg(windows)]\n    for key in [\n        "ALLUSERSPROFILE",')
          end_marker = '    }\n}\n\nfn run_bounded('
          end = text.index(end_marker, start)
          text = text[:start] + '}\n\nfn run_bounded(' + text[end + len(end_marker):]
          renpy.write_text(text)
          PY
      - name: Format
        working-directory: app
        run: cargo fmt --all && cargo fmt --check --all
      - name: Run local core suite
        working-directory: app
        run: cargo test -p loomlight-core --locked
      - name: Commit environment tightening
        shell: bash
        run: |
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add app/src-core/src/renpy.rs
          git diff --cached --check
          git commit -m "fix: keep Ren'Py child environment minimal"
          git push origin HEAD:phase1c-corrective-targets
