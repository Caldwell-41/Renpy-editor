name: Phase 1C target verification

on:
  push:
    branches: [phase1c-corrective-targets]
    paths:
      - app/src-core/**

permissions:
  contents: read

jobs:
  target:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective-targets
      - name: Record runner and toolchain
        shell: bash
        run: |
          uname -a || true
          rustc --version --verbose
          cargo --version --verbose
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: phase-1c-corrective-target-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: "false"
      - name: Check Rust formatting
        run: cargo fmt --check --all
      - name: Run complete core suite
        shell: bash
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/phase-1c-core.log"
      - name: Restore pinned Ren'Py SDK archive
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Download pinned official Ren'Py SDK on cache miss
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: .
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
      - name: Exercise corrected Phase 1C lifecycle gate
        shell: bash
        env:
          LOOMLIGHT_PHASE1C_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked \
            lifecycle::tests::official_sdk_phase_1c_target_gate -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/phase-1c-target.log"
          grep 'phase-1c-target-gate: passed' "$RUNNER_TEMP/phase-1c-target.log"
      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-1c-corrective-target-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/phase-1c-core.log
            ${{ runner.temp }}/phase-1c-target.log
          if-no-files-found: warn
          retention-days: 7
