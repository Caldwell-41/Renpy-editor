name: Phase 1 production gates

on:
  workflow_dispatch:
    inputs:
      expected_ref:
        description: Exact branch or tag used to resolve the candidate
        required: true
        type: string
      expected_sha:
        description: Full candidate commit SHA resolved by the requested ref
        required: true
        type: string
      operation_key:
        description: Deterministic public identity of candidate, workflow, ref, and options
        required: true
        type: string
      request_id:
        description: Opaque per-operation correlation UUID
        required: true
        type: string
      upload_packages:
        description: Upload packaged applications after mandatory package builds
        required: false
        default: false
        type: boolean
      force_full:
        description: Reserved no-reuse marker; does not grant retry authority
        required: false
        default: false
        type: boolean
  push:
    branches: [main, corrective/phase-1a-1d-integrated]
    paths:
      - .github/workflows/production-scaffold.yml
      - app/**

permissions:
  contents: read

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Phase 1 production gates / {0} / packages={1} / full={2} / request={3}', inputs.operation_key, inputs.upload_packages, inputs.force_full, inputs.request_id)
      || format('Phase 1 production gates / {0}', github.sha) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    name: Validate candidate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - name: Validate immutable candidate identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EXPECTED_REF: ${{ inputs.expected_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          candidate="$EVENT_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "expected_sha must be a full lowercase commit SHA" >&2
              exit 1
            }
            [[ "$EXPECTED_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || {
              echo "expected_ref must be an explicit safe ref name" >&2
              exit 1
            }
            [ "$EXPECTED_REF" = "$EVENT_REF_NAME" ] || {
              echo "requested ref name did not match expected_ref" >&2
              exit 1
            }
            [[ "$OPERATION_KEY" =~ ^[0-9a-f]{64}$ ]] || {
              echo "operation_key must be a lowercase SHA-256 value" >&2
              exit 1
            }
            [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
              echo "request_id must be an opaque UUIDv4" >&2
              exit 1
            }
            [ "$EXPECTED_SHA" = "$EVENT_SHA" ] || {
              echo "requested ref did not resolve to expected_sha" >&2
              exit 1
            }
            candidate="$EXPECTED_SHA"
          fi
          echo "checkout_sha=$candidate" >> "$GITHUB_OUTPUT"
      - name: Check out validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.identity.outputs.checkout_sha }}
      - name: Validate operation identity
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_REF: ${{ inputs.expected_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FORCE_FULL: ${{ inputs.force_full }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          UPLOAD_PACKAGES: ${{ inputs.upload_packages }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          revision = subprocess.run(
              ["git", "rev-parse", "HEAD:.github/workflows/production-scaffold.yml"],
              check=True,
              capture_output=True,
              text=True,
              timeout=30,
          ).stdout.strip()
          payload = {
              "candidate_sha": os.environ["EXPECTED_SHA"],
              "options": {
                  "force_full": os.environ["FORCE_FULL"].lower() == "true",
                  "upload_packages": os.environ["UPLOAD_PACKAGES"].lower() == "true",
              },
              "ref": os.environ["EXPECTED_REF"],
              "repository": "Caldwell-41/Renpy-editor",
              "workflow": "production-scaffold.yml",
              "workflow_revision": revision,
          }
          actual = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          if actual != os.environ["OPERATION_KEY"]:
              raise SystemExit("operation identity did not match the checked-out candidate")
          PY
      - name: Validate repository and CI helpers
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests/ci_privacy -v
          python3 -m unittest discover -s tests/ci_tooling -v

  packaged-boundary:
    name: ${{ matrix.name }}
    needs: validate-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-candidate.outputs.checkout_sha }}
      - name: Select locked Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select locked npm toolchain
        run: npm install --global npm@11.9.0
      - name: Record runner and toolchain
        shell: bash
        run: |
          uname -a || true
          node --version
          npm --version
          rustc --version --verbose
          cargo --version --verbose
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: phase-1b-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: "false"
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Validate frontend and protocol
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --check --all
      - name: Test independent Rust core
        shell: bash
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked -- --nocapture \
            | tee "$RUNNER_TEMP/phase-1b-transactions.log"
          grep 'recent_crash_checkpoints_restart_from_a_complete_store' "$RUNNER_TEMP/phase-1b-transactions.log"
          grep -E 'recent_(symlink|reparse)_substitution_fails_closed_without_touching_target' "$RUNNER_TEMP/phase-1b-transactions.log"
          grep 'substitution_after_final_validation_never_survives_as_final' "$RUNNER_TEMP/phase-1b-transactions.log"
          grep 'parent_substitution_after_validation_cannot_redirect_stage_creation' "$RUNNER_TEMP/phase-1b-transactions.log"
          grep 'project_open_metadata_substitution_is_never_followed' "$RUNNER_TEMP/phase-1b-transactions.log"
          grep -E 'managed_sdk_directory_(symlink|reparse)_fails_closed_without_touching_target' "$RUNNER_TEMP/phase-1b-transactions.log"
      - name: Restore pinned Ren'Py SDK archive
        id: phase-1c-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Download pinned official Ren'Py SDK on cache miss
        if: steps.phase-1c-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
      - name: Exercise Phase 1C lifecycle through Phase 1E Scene target gate
        shell: bash
        env:
          LOOMLIGHT_PHASE1C_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked \
            lifecycle::tests::official_sdk_phase_1c_target_gate -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1c-target-gate: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1c-remediation-sdk-recovery: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1c-remediation-sdk-trust-order: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1c-remediation-stage-races: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1d-target-gate: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1d-exact-ipc-gate: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1d-import-authority-gate: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1d-corrective-target-gate: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1e-scene-authoring-target-gate: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
          grep 'phase-1e-media-target-gate: passed' "$RUNNER_TEMP/phase-1c-project-lifecycle.log"
      - name: Exercise SDK download handoff and verified managed reuse
        shell: bash
        env:
          LOOMLIGHT_PHASE1C_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked \
            renpy::reconciliation_tests::official_sdk_download_handoff_target_gate -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/phase-1c-sdk-download-handoff.log"
          grep 'phase-1c-network-handoff-gate: passed' "$RUNNER_TEMP/phase-1c-sdk-download-handoff.log"
      - name: Test desktop Rust boundary
        run: cargo test -p loomlight-desktop --release --locked
      - name: Package production scaffold
        run: npm exec -- tauri build -- --locked
      - name: Run packaged WebView boundary smoke
        shell: bash
        env:
          LOOMLIGHT_SCAFFOLD_SMOKE: "1"
          LOOMLIGHT_SINGLE_INSTANCE_SMOKE: "1"
          LOOMLIGHT_SMOKE_SECRET: loomlight-${{ github.run_id }}-${{ github.run_attempt }}-sentinel
          TARGET_OS: ${{ runner.os }}
        run: |
          set -o pipefail
          if [ "$TARGET_OS" = "Windows" ]; then
            LOOMLIGHT_EXECUTABLE=./target/release/loomlight.exe
          else
            LOOMLIGHT_EXECUTABLE=./target/release/bundle/macos/Loomlight.app/Contents/MacOS/loomlight
          fi

          PRIMARY_LOG="$RUNNER_TEMP/loomlight-scaffold-smoke.json"
          SECONDARY_LOG="$RUNNER_TEMP/loomlight-single-instance-secondary.log"
          "$LOOMLIGHT_EXECUTABLE" > "$PRIMARY_LOG" 2>&1 &
          PRIMARY_PID=$!
          trap 'kill "$PRIMARY_PID" 2>/dev/null || true' EXIT

          PRIMARY_READY=false
          for _ in {1..200}; do
            if grep -q '"evidence":"single-instance-primary-ready"' "$PRIMARY_LOG" 2>/dev/null; then
              PRIMARY_READY=true
              break
            fi
            if ! kill -0 "$PRIMARY_PID" 2>/dev/null; then
              cat "$PRIMARY_LOG"
              echo "Primary Loomlight process exited before its deterministic readiness marker." >&2
              exit 1
            fi
            sleep 0.1
          done
          if [ "$PRIMARY_READY" != "true" ]; then
            cat "$PRIMARY_LOG"
            echo "Primary Loomlight process did not publish its deterministic readiness marker." >&2
            exit 1
          fi

          "$LOOMLIGHT_EXECUTABLE" > "$SECONDARY_LOG" 2>&1
          wait "$PRIMARY_PID"
          trap - EXIT
          cat "$PRIMARY_LOG"
          cat "$SECONDARY_LOG"

          grep '"evidence":"single-instance-secondary-rejected"' "$PRIMARY_LOG"
          grep '"primaryWindowFound":true' "$PRIMARY_LOG"
          grep '"navigationDenied":true' "$RUNNER_TEMP/loomlight-scaffold-smoke.json"
          grep '"webviewRestrictionsPassed":true' "$RUNNER_TEMP/loomlight-scaffold-smoke.json"
          grep '"lifecycleUiPassed":true' "$RUNNER_TEMP/loomlight-scaffold-smoke.json"
          grep '"supportingAuthoringUiPassed":true' "$RUNNER_TEMP/loomlight-scaffold-smoke.json"
          grep '"sceneAuthoringUiPassed":true' "$RUNNER_TEMP/loomlight-scaffold-smoke.json"
          grep '"singleInstancePassed":true' "$RUNNER_TEMP/loomlight-scaffold-smoke.json"
          if grep -q '"evidence":"single-instance-primary-ready"' "$SECONDARY_LOG"; then
            echo "Secondary Loomlight process reached setup and initialized lifecycle state." >&2
            exit 1
          fi
      - name: Scan production artifacts for secrets
        shell: bash
        env:
          LOOMLIGHT_SMOKE_SECRET: loomlight-${{ github.run_id }}-${{ github.run_attempt }}-sentinel
          TARGET_OS: ${{ runner.os }}
        run: |
          if [ "$TARGET_OS" = "Windows" ]; then
            node scripts/scan-artifacts.mjs dist target/release/loomlight.exe target/release/bundle
          else
            node scripts/scan-artifacts.mjs dist target/release/bundle/macos/Loomlight.app
          fi
      - name: Record dependency and licence inventory
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          node scripts/dependency-inventory.mjs \
            --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --output "$RUNNER_TEMP/dependency-inventory.json"
      - name: Upload lightweight production evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-1-production-evidence-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/loomlight-scaffold-smoke.json
            ${{ runner.temp }}/loomlight-single-instance-secondary.log
            ${{ runner.temp }}/phase-1b-transactions.log
            ${{ runner.temp }}/phase-1c-project-lifecycle.log
            ${{ runner.temp }}/phase-1c-sdk-download-handoff.log
            ${{ runner.temp }}/dependency-inventory.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload packaged application for manual runs
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_packages }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-1-production-package-${{ matrix.runner }}
          path: app/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 7
