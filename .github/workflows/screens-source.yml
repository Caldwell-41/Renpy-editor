name: Screens qualification

# Closed source/Help qualifications retain their guards. L01 has its own explicit selector.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact reviewed candidate SHA
        type: string
        required: true
      ordinal:
        description: Cumulative dispatch ordinal for the selected outcome
        type: string
        required: true
        default: '3'
      owned_blank:
        description: Select L01 owned blank screen proof; leaves closed Help qualification untouched
        type: boolean
        default: false
      canvas_helper:
        description: Select L17 bounded canvas helper proof; preserve closed Help/L01 selections
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: help-screen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Reject conflicting qualification selectors
        env:
          OWNED_BLANK: ${{ inputs.owned_blank }}
          CANVAS_HELPER: ${{ inputs.canvas_helper }}
        run: |
          if test "$OWNED_BLANK" = true && test "$CANVAS_HELPER" = true; then
            echo '::error::Select only one qualification outcome.'
            exit 1
          fi

  focused:
    if: ${{ !inputs.owned_blank && !inputs.canvas_helper }}
    name: Help (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: Windows x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.90.0
      PYTHONUTF8: '1'
      HARNESS_PYTHON: ${{ matrix.runner == 'windows-2025' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected candidate and allowance
        env:
          CANDIDATE: ${{ inputs.candidate }}
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/phase3b-screen-designer
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ORDINAL" = 3
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/help-production"
          git rev-parse HEAD > "$RUNNER_TEMP/help-production/candidate.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: help-production-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: 'false'
      - name: Select pinned tools and dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          npm install --global npm@11.9.0
          npm ci
      - name: Rejecting receipt gates; reuse unchanged CI2 frontend proof
        run: |
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p 'test_help_screen_evidence.py' -v
      - name: Affected SDK gate, fresh source driver and desktop build prerequisite
        run: |
          cargo test -p loomlight-core help_preview_gate --locked
          cargo build -p loomlight-core --example help-controller-driver --locked
          npm run build
          cargo check -p loomlight-desktop --locked
      - name: Real renderer and core; rehearse native controller with a runtime test double
        env:
          HELP_SCREEN_OUTPUT: ${{ runner.temp }}/help-production/browser
          HELP_PROBE_CONTROLLER_OUTPUT: ${{ runner.temp }}/help-production/controller-only
          HELP_PROBE_TARGET_OS: windows
          HELP_PROBE_STOP_EXIT: '-1073741510'
        run: |
          node tests/help-screen.browser.mjs
          node tests/help-probe-controller.browser.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: runner.os == 'Windows'
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Fetch official checksum metadata and pinned SDK
        if: runner.os == 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 --output "$RUNNER_TEMP/help-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.sdk-cache.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
          "$HARNESS_PYTHON" scripts/verify-help-sdk.py "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" "$RUNNER_TEMP/help-checksums.txt"
      - name: Use short fresh Windows scratch root
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          $scratch = "C:\llhelp$env:ORDINAL"
          if (Test-Path $scratch) { throw 'Help scratch root already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TEMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Two-aspect real SDK compile, lint, geometry, staleness and clean Stop
        # CI1 skipped both aspects; CI2 used one preview. Actual remaining capacity is three.
        if: runner.os == 'Windows' && inputs.ordinal == '3'
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_HELP_ACCEPTED: ${{ runner.temp }}/help-production/browser/accepted.rpy
          LOOMLIGHT_HELP_SDK_EVIDENCE: ${{ runner.temp }}/help-production/sdk
        run: cargo test -p loomlight-core help_scratch_preview_sdk_geometry_revision_and_cleanup --locked -- --ignored --nocapture
      - name: Build one Windows package
        if: runner.os == 'Windows'
        run: |
          echo 'Cumulative Windows package 2 reserved by dispatch 3' > "$RUNNER_TEMP/help-production/package-reservation.txt"
          npm exec -- tauri build --bundles nsis -- --locked
      - name: Verify Windows package architecture and retain identities
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [IO.File]::ReadAllBytes((Resolve-Path 'target/release/loomlight.exe'))
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Windows x64 executable required' }
          $installers = @(Get-ChildItem 'target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Exactly one NSIS installer required' }
          @{ candidate=$env:GITHUB_SHA; architecture='Windows x64'; executableSHA256=(Get-FileHash 'target/release/loomlight.exe').Hash; installerSHA256=(Get-FileHash $installers[0].FullName).Hash } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/help-production/package-identity.json" -Encoding utf8
      - name: One native WebView to SDK Help round trip
        if: runner.os == 'Windows'
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          echo 'Cumulative Windows app 2 and preview 4 reserved by dispatch 3' > "$RUNNER_TEMP/help-production/native-reservation.txt"
          "$HARNESS_PYTHON" scripts/run-runtime-ui-probes.py target/release/loomlight.exe "$RUNNER_TEMP/help-production/native" help-screen
      - name: Scan complete or partial public fixture evidence
        id: privacy
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/help-production"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/help-production"
      - name: Retain evidence
        if: ${{ always() && steps.privacy.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: help-production-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/help-production/
          if-no-files-found: error
          retention-days: 7

  owned-blank:
    if: ${{ inputs.owned_blank && !inputs.canvas_helper }}
    name: Owned blank screen (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: Windows x64
          - runner: macos-26
            target: macOS ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.90.0
      PYTHONUTF8: '1'
      HARNESS_PYTHON: ${{ matrix.runner == 'windows-2025' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected L01 candidate and cumulative ordinal
        env:
          CANDIDATE: ${{ inputs.candidate }}
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/phase3b-screen-designer
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$ORDINAL" in 1|2|3) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/owned-screen"
          git rev-parse HEAD > "$RUNNER_TEMP/owned-screen/candidate.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: owned-screen-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: 'false'
      - name: Pinned dependencies and inexpensive evidence checks
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          npm install --global npm@11.9.0
          npm ci
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p 'test_owned_screen_evidence.py' -v
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p 'test_owned_screen_runner.py' -v
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p 'test_help_screen_evidence.py' -v
          npm run check
      - name: Shared ownership, Source, metadata, Help and desktop gates
        run: |
          cargo test -p loomlight-core --release --locked --lib --no-run --message-format=json > "$RUNNER_TEMP/owned-screen/core-build.jsonl"
          cargo test -p loomlight-core --release --locked --lib screens::tests -- --nocapture
          cargo test -p loomlight-core --release --locked --lib metadata::tests -- --nocapture
          cargo test -p loomlight-core --release --locked --lib source::tests -- --nocapture
          cargo test -p loomlight-core --release --locked --lib scene::logic::tests::phase3a_v3_v4_call_menu_refinement_preserves_records_and_reopen -- --exact --nocapture
          cargo build -p loomlight-core --example help-controller-driver --locked
          npm run build
          cargo check -p loomlight-desktop --locked
      - name: Production renderer, core and exact packaged controller rehearsal
        env:
          OWNED_SCREEN_OUTPUT: ${{ runner.temp }}/owned-screen/browser
          OWNED_PROBE_OUTPUT: ${{ runner.temp }}/owned-screen/controller
          HELP_SCREEN_OUTPUT: ${{ runner.temp }}/owned-screen/help-regression
        run: |
          node tests/owned-screen.browser.mjs
          node tests/owned-screen-probe.browser.mjs
          node tests/help-screen.browser.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: owned-sdk-cache
        if: runner.os == 'Windows'
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Verify pinned official SDK
        if: runner.os == 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 --output "$RUNNER_TEMP/owned-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.owned-sdk-cache.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
          "$HARNESS_PYTHON" scripts/verify-help-sdk.py "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" "$RUNNER_TEMP/owned-checksums.txt"
      - name: Short isolated Windows SDK path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scratch = "C:\llowned${{ inputs.ordinal }}"
          if (Test-Path $scratch) { throw 'L01 scratch root already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TEMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Deliberate blank-screen compile, lint, render, Stop and cleanup
        if: runner.os == 'Windows'
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_OWNED_SCREEN_ACCEPTED: ${{ runner.temp }}/owned-screen/browser/accepted.rpy
          LOOMLIGHT_OWNED_SCREEN_SDK_EVIDENCE: ${{ runner.temp }}/owned-screen/sdk
        run: cargo test -p loomlight-core --release --locked --lib lifecycle::runtime_tests::owned_blank_screen_sdk_preview_and_cleanup -- --exact --ignored --nocapture
      - name: Windows package and real WebView creation path
        if: runner.os == 'Windows'
        run: |
          npm exec -- tauri build --bundles nsis -- --locked
          "$HARNESS_PYTHON" scripts/run-runtime-ui-probes.py target/release/loomlight.exe "$RUNNER_TEMP/owned-screen/native" owned-screen
      - name: Retain Windows package identity
        if: ${{ always() && runner.os == 'Windows' && hashFiles('app/target/release/loomlight.exe') != '' }}
        shell: pwsh
        run: |
          $binary = [IO.File]::ReadAllBytes((Resolve-Path 'target/release/loomlight.exe'))
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Windows x64 executable required' }
          @{ candidate=$env:GITHUB_SHA; architecture='Windows x64'; executableSHA256=(Get-FileHash 'target/release/loomlight.exe').Hash } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/owned-screen/package-identity.json" -Encoding utf8
      - name: Retain exact produced test and desktop executables, including failures
        if: always()
        run: |
          "$HARNESS_PYTHON" - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'owned-screen'
          out.mkdir(exist_ok=True)
          build = out / 'core-build.jsonl'
          paths = []
          if build.is_file():
              for line in build.read_text().splitlines():
                  row = json.loads(line)
                  if row.get('reason') == 'compiler-artifact' and row.get('profile', {}).get('test') and row.get('target', {}).get('name') == 'loomlight_core' and row.get('executable'):
                      paths.append(Path(row['executable']))
          desktop = Path('target/release/loomlight.exe')
          if os.name == 'nt' and desktop.is_file():
              paths.append(desktop)
          identities = []
          for source in paths:
              destination = out / 'executables' / source.name
              destination.parent.mkdir(exist_ok=True)
              shutil.copyfile(source, destination)
              identities.append(dict(name=source.name, sha256=hashlib.sha256(destination.read_bytes()).hexdigest()))
          (out / 'executable-identities.json').write_text(json.dumps(identities, indent=2))
          PY
      - name: Scan partial or complete public fixture evidence
        id: owned-privacy
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/owned-screen"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/owned-screen"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.owned-privacy.outcome == 'success' }}
        with:
          name: owned-screen-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owned-screen/
          if-no-files-found: error
          retention-days: 7

  canvas-helper:
    if: ${{ inputs.canvas_helper && !inputs.owned_blank }}
    name: L17 canvas helper (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.90.0
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected L17 candidate and cumulative ordinal
        env:
          CANDIDATE: ${{ inputs.candidate }}
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/phase3b-screen-designer
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$ORDINAL" in 1|2|3|4|5) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/canvas-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/canvas-proof/candidate.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: canvas-helper-windows
          workspaces: app -> target
          cache-bin: 'false'
      - name: Pinned dependencies and portable checks
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          npm install --global npm@11.9.0
          npm ci
          python -m unittest discover -s scripts -p 'test_canvas_evidence.py' -v
          npm run typecheck
          npm run build:tests
          node --test dist-tests/tests/screen-ui.dom.test.js
          cargo test -p loomlight-core --release --locked --lib screens::tests -- --nocapture
          cargo test -p loomlight-core --release --locked --lib lifecycle::tests::recent_store_replaces_atomically_without_normal_temp_leaks -- --exact --nocapture
          cargo build -p loomlight-core --examples --locked
          cargo build -p loomlight-core --release --example canvas-controller-driver --locked
          npm run build
          cargo check -p loomlight-desktop --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: canvas-sdk-cache
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-Windows-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Verify official pinned SDK
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 --output "$RUNNER_TEMP/canvas-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.canvas-sdk-cache.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
          python scripts/verify-help-sdk.py "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" "$RUNNER_TEMP/canvas-checksums.txt"
      - name: Short fresh Windows scratch root
        shell: pwsh
        run: |
          $scratch = "C:\llcanvas${{ inputs.ordinal }}"
          if (Test-Path $scratch) { throw 'L17 scratch root already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TEMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Production browser to helper, two aspects, samples and draft/history regression
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_CANVAS_EVIDENCE: ${{ runner.temp }}/canvas-proof/browser
          HELP_SCREEN_OUTPUT: ${{ runner.temp }}/canvas-proof/help-regression
        run: |
          node tests/canvas-helper.browser.mjs
          LOOMLIGHT_CANVAS_EVIDENCE="$RUNNER_TEMP/canvas-proof/controller" node tests/canvas-helper-probe.browser.mjs
          node tests/help-screen.browser.mjs
      - name: Deliberate Ren'Py reference captures and clean Stop
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_CANVAS_EVIDENCE: ${{ runner.temp }}/canvas-proof/reference
        run: cargo test -p loomlight-core --release --locked --lib lifecycle::runtime_tests::canvas_reference_sdk_captures_actual_screen_at_two_internal_aspects -- --exact --ignored --nocapture
      - name: One Windows package and native WebView to helper round trip
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          npm exec -- tauri build --bundles nsis -- --locked
          python scripts/run-runtime-ui-probes.py target/release/loomlight.exe "$RUNNER_TEMP/canvas-proof/native" canvas-helper
      - name: Retain package identity
        if: ${{ always() && hashFiles('app/target/release/loomlight.exe') != '' }}
        shell: pwsh
        run: |
          $binary = [IO.File]::ReadAllBytes((Resolve-Path 'target/release/loomlight.exe'))
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Windows x64 executable required' }
          @{ candidate=$env:GITHUB_SHA; architecture='Windows x64'; executableSHA256=(Get-FileHash 'target/release/loomlight.exe').Hash } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/canvas-proof/package-identity.json" -Encoding utf8
      - name: Scan complete or partial public fixture evidence
        id: canvas-privacy
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/canvas-proof"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/canvas-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.canvas-privacy.outcome == 'success' }}
        with:
          name: canvas-helper-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canvas-proof/
          if-no-files-found: error
          retention-days: 7
