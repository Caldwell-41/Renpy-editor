name: Phase 0 quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run lossless-source spike tests
        run: python3 -m unittest discover -s spikes/lossless-source/tests -v
      - name: Run SDK boundary spike tests
        run: python3 -m unittest discover -s spikes/renpy-sdk/tests -v
      - name: Validate Phase 0 artifacts and scan for secrets
        run: python3 scripts/validate.py
