name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      validation_dummy:
        description: Run only the cheap PR validation dummy; no SDK or package
        type: boolean
        default: false
      validation_dummy_result:
        description: Expected dummy outcome
        type: choice
        options: ['pass', 'fail']
        default: 'pass'
      studio_connection_native:
        description: Only approved current connection Windows native proof and both-host fixture gates
        type: boolean
        default: false
      studio_connection_candidate:
        description: Exact reviewed current native harness commit
        type: string
        default: ''
      studio_connection_ordinal:
        description: Cumulative approved current connection native attempt (1, 2 or 3)
        type: string
        default: '1'
      harness_regressions:
        description: Only inexpensive Windows/macOS harness checks; no SDK, package or editor launch
        type: boolean
        default: false
      thinking_settings:
        description: Only selected thinking and draft-connection qualification on Windows and Mac
        type: boolean
        default: false
      thinking_settings_candidate:
        description: Exact reviewed implementation commit SHA
        type: string
        default: ''
      thinking_settings_ordinal:
        description: Cumulative thinking/connection paired attempt, 1 through 3
        type: string
        default: '1'
      phase1g_flow_profile:
        description: Run bounded G1-OBS core, rendered interaction and three-sample budgets (no package)
        required: false
        type: boolean
        default: false
      phase1g_candidate_proof:
        description: Select G1-O1 safety and three fixed feasibility samples (requires flow profile)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  code-checks:
    if: ${{ !inputs.validation_dummy && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    name: Frontend tests and Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      HARNESS_PYTHON: python3
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Select checks from the tested PR merge
        id: scope
        working-directory: .
        run: python3 scripts/pr_scope.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ steps.scope.outputs.code == 'true' }}
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm and check Python
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: |
          npm install --global npm@11.9.0
          python3 -c "import sys; assert sys.version_info >= (3, 11)"
      - name: Install locked frontend dependencies
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: npm ci --ignore-scripts
      - name: Typecheck and test the frontend
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: npm run check
      - name: Build the production frontend
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: npm run build
      - name: Check Rust formatting independently of frontend results
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          cargo +1.90.0 fmt --check --all
      - name: Run offline Help evidence admission gates
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/help-offline-python"
          "$RUNNER_TEMP/help-offline-python/bin/python" -m pip install Pillow==12.3.0
          "$RUNNER_TEMP/help-offline-python/bin/python" -m unittest discover -s scripts -p test_qualify_help_dialog.py -v
          "$RUNNER_TEMP/help-offline-python/bin/python" -m unittest discover -s scripts -p test_base_help_fidelity.py -v
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        with:
          key: help-offline-core
          workspaces: app -> target
          cache-bin: 'false'
      - name: Check Help creation, references and fractional geometry without SDK execution
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/help-offline"
          for filter in scene::logic::dialog_tests screens::tests::references screens::canvas::tests::base_help_fidelity_exports_typed_assets_styles_and_exact_source_without_execution screens::canvas::tests::helper_accounting_reserves_failed_initial_and_replacement_owner_attempts_offline lifecycle::canvas_tests::canvas_status_preserves_helper_fractional_geometry; do
            cargo +1.90.0 test -p loomlight-core --locked --message-format=json-render-diagnostics --lib "$filter" -- --nocapture 2>&1 | tee -a "$RUNNER_TEMP/help-offline/core-artifacts.jsonl" | tee "$RUNNER_TEMP/help-offline/${filter//::/-}.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/help-offline/${filter//::/-}.log"
          done
      - name: Exercise Dialog controllers through production core
        if: ${{ !cancelled() && steps.scope.outputs.code == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/help-offline"
          cargo +1.90.0 build -p loomlight-core --locked --example help-controller-driver --message-format=json-render-diagnostics 2>&1 | tee "$RUNNER_TEMP/help-offline/controller-artifacts.jsonl"
          DIALOG_CORE_UI_OUTPUT="$RUNNER_TEMP/help-offline/controller" node tests/screen-dialog-core.dispatch.mjs
      - name: Seal and scan failed Help diagnostics and producing executables
        id: help_privacy
        if: ${{ steps.scope.outputs.code == 'true' && failure() }}
        run: |
          python3 - <<'PY'
          import os, runpy, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          folder = Path(os.environ['RUNNER_TEMP']) / 'help-offline'
          folder.mkdir(parents=True, exist_ok=True)
          utilities = runpy.run_path('scripts/check-thinking-evidence.py')
          utilities['retain_binaries'](folder, Path('target'), artifacts=utilities['HELP_ARTIFACTS'])
          utilities['seal'](folder, Path('..'), 'help-offline-ci')
          PY
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/help-offline"
      - name: Upload privacy-checked Help failure evidence
        if: ${{ steps.scope.outputs.code == 'true' && failure() && steps.help_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: help-offline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/help-offline
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  studio-connection-native:
    if: ${{ !inputs.validation_dummy && (github.event_name == 'workflow_dispatch' && inputs.studio_connection_native) }}
    uses: ./.github/workflows/studio-connection-native.yml
    with:
      candidate: ${{ inputs.studio_connection_candidate }}
      ordinal: ${{ inputs.studio_connection_ordinal }}
      selector_conflict: ${{ inputs.harness_regressions || inputs.thinking_settings || inputs.phase1g_flow_profile || inputs.phase1g_candidate_proof }}

  harness-regressions:
    if: ${{ !inputs.validation_dummy && (!inputs.studio_connection_native && (github.event_name == 'workflow_dispatch' && inputs.harness_regressions)) }}
    name: Harness regressions — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      HARNESS_PYTHON: ${{ matrix.runner == 'windows-2025' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require isolated harness selection and actual target identity
        shell: bash
        env:
          EXCLUDED_SELECTORS: ${{ inputs.thinking_settings || inputs.phase1g_flow_profile || inputs.phase1g_candidate_proof }}
        run: |
          set -euo pipefail
          test "$EXCLUDED_SELECTORS" = false
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$HARNESS_PYTHON" -c "import os,platform,sys; assert sys.version_info >= (3,11); assert platform.machine().lower() == ('arm64' if os.environ['RUNNER_OS']=='macOS' else 'amd64')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Prepare isolated Python image evidence dependency
        shell: bash
        run: |
          set -euo pipefail
          "$HARNESS_PYTHON" -m venv "$RUNNER_TEMP/harness-python"
          if test "$RUNNER_OS" = Windows; then
            harness_python="$RUNNER_TEMP/harness-python/Scripts/python.exe"
          else
            harness_python="$RUNNER_TEMP/harness-python/bin/python"
          fi
          "$harness_python" -m pip install Pillow==12.3.0
          printf 'HARNESS_PYTHON=%s\n' "$harness_python" >> "$GITHUB_ENV"
      - name: Run all independent harness groups and print failed assertions
        shell: bash
        run: |
          args=()
          if test "$RUNNER_OS" = Windows; then args+=(--native-dialog); fi
          "$HARNESS_PYTHON" app/scripts/run-harness-checks.py --output "$RUNNER_TEMP/harness-regressions" "${args[@]}"
      - name: Retain identity, summary and privacy-approved partial results
        id: harness_privacy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harness-regressions"
          git rev-parse HEAD > "$RUNNER_TEMP/harness-regressions/candidate.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/harness-regressions/tree.txt"
          if test -f "$RUNNER_TEMP/harness-regressions/summary.md"; then
            cat "$RUNNER_TEMP/harness-regressions/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Harness result unavailable; qualification incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi
          "$HARNESS_PYTHON" app/scripts/check-thinking-evidence.py seal "$RUNNER_TEMP/harness-regressions" . --outcome harness-regressions
          node app/scripts/scan-artifacts.mjs "$RUNNER_TEMP/harness-regressions"
      - name: Require complete unchanged harness source identity
        if: success()
        shell: bash
        run: |
          "$HARNESS_PYTHON" -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'harness-regressions/identity.json').read_text()); assert r['sourceMatchesCandidate'] and r['candidate']==os.environ['GITHUB_SHA'] and r['runId']==os.environ['GITHUB_RUN_ID'] and r['attempt']==os.environ['GITHUB_RUN_ATTEMPT'] and r['outcome']=='harness-regressions'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.harness_privacy.outcome == 'success' }}
        with:
          name: harness-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-regressions/
          if-no-files-found: error
          retention-days: 7

  validate:
    if: ${{ !inputs.validation_dummy && (!inputs.studio_connection_native && (github.event_name != 'workflow_dispatch' || (!inputs.harness_regressions && !inputs.thinking_settings && !inputs.phase1g_flow_profile))) }}
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate repository structure, links, privacy, and secrets
        run: python3 scripts/validate.py
      - name: Test repository section-link validation
        run: python3 -m unittest discover -s scripts -p test_validate.py -v
      - name: Test documentation-only PR selection
        run: python3 -m unittest discover -s scripts -p test_pr_scope.py -v
      - name: Test complete PR validation reporting
        run: python3 -m unittest discover -s scripts -p test_ci_validation.py -v
      - name: Exercise bounded Q1 gate rejection fixtures
        run: |
          python3 app/scripts/check-q1-prep-gates.py self-test
          python3 app/scripts/test-q1-package-retention.py
      - name: Audit Q1 selectors and retained cases
        run: python3 app/scripts/check-q1-prep-gates.py source-audit .

  phase1g-flow-profile:
    if: ${{ !inputs.validation_dummy && (!inputs.studio_connection_native && (github.event_name == 'workflow_dispatch' && !inputs.harness_regressions && !inputs.thinking_settings && inputs.phase1g_flow_profile)) }}
    name: Phase 1G flow profile — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      Q1_PYTHON: ${{ matrix.runner == 'windows-2025' && 'python' || 'python3' }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: phase-1b-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: "false"
      - name: Set up pinned Node for observed UI gates
        if: ${{ !inputs.phase1g_candidate_proof }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select locked npm toolchain
        if: ${{ !inputs.phase1g_candidate_proof }}
        run: npm install --global npm@11.9.0
      - name: Ordinary reliability and UI regressions
        if: ${{ !inputs.phase1g_candidate_proof }}
        shell: bash
        run: |
          set -o pipefail
          node --version
          npm --version
          "$Q1_PYTHON" --version
          npm ci --ignore-scripts
          npm run check 2>&1 | tee "$RUNNER_TEMP/observed-ui.log"
          cargo test -p loomlight-core --release --locked -- \
            --skip scene::tests::flow_observed_budget_fixture_500_scenes_2000_edges \
            --skip lifecycle::tests::official_sdk_phase_1c_target_gate \
            --skip renpy::reconciliation_tests::official_sdk_download_handoff_target_gate \
            --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/observed-core.log"
          "$Q1_PYTHON" scripts/check-q1-prep-gates.py cargo-log "$RUNNER_TEMP/observed-core.log"
      - name: Three isolated real-service observed-flow samples
        if: ${{ !inputs.phase1g_candidate_proof }}
        shell: bash
        env:
          LOOMLIGHT_ENFORCE_FLOW_BUDGETS: "1"
          LOOMLIGHT_FLOW_EVIDENCE: ${{ runner.temp }}/runtime-flow.json
        run: |
          set -o pipefail
          git rev-parse HEAD
          rustc -Vv
          cargo test -p loomlight-core --release --locked scene::tests::flow_observed_budget_fixture_500_scenes_2000_edges -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/runtime-flow-profile.log"
          "$Q1_PYTHON" scripts/check-q1-prep-gates.py cargo-log "$RUNNER_TEMP/runtime-flow-profile.log"
          grep 'phase-1g-observed-budget-gate: passed (3 samples)' "$RUNNER_TEMP/runtime-flow-profile.log"
      - name: Rendered interaction during refresh
        if: ${{ !inputs.phase1g_candidate_proof }}
        shell: bash
        env:
          LOOMLIGHT_FLOW_EVIDENCE: ${{ runner.temp }}/runtime-flow.json
          LOOMLIGHT_BRANCHES_SCREENSHOT: ${{ runner.temp }}/observed-branches.png
        run: |
          set -o pipefail
          node tests/branches.browser.mjs 2>&1 | tee "$RUNNER_TEMP/observed-browser.log"
      - name: Prove isolated verified candidates
        if: ${{ inputs.phase1g_candidate_proof }}
        shell: bash
        env:
          LOOMLIGHT_ENFORCE_FLOW_BUDGETS: "1"
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -Vv
            if [ "$RUNNER_OS" = "Windows" ]; then
              powershell -NoProfile -Command 'Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture; Get-Volume | Select-Object DriveLetter,FileSystemType'
            else
              sw_vers
              df "$RUNNER_TEMP"
              diskutil info /
            fi
            cargo test -p loomlight-core --release --locked g1_o1 -- --ignored --skip g1_o1_n_ordered_safety --skip g1_o1_feasibility --test-threads=1 --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/runtime-flow-profile.log"
          safety=${PIPESTATUS[0]}
          if [ "$safety" -ne 0 ]; then exit "$safety"; fi
          if grep -q 'g1-o1-safety-counterexample:' "$RUNNER_TEMP/runtime-flow-profile.log"; then
            echo 'G1-O1 rejected: known safety counterexample; profiling cannot qualify this candidate.'
            exit 1
          fi
          set +e
          failed=0
          for sample in 1 2 3; do
            echo "g1-o1-sample: $sample" | tee -a "$RUNNER_TEMP/runtime-flow-profile.log"
            cargo test -p loomlight-core --release --locked scene::tests::candidate_proof::g1_o1_feasibility -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/g1-o1-sample-$sample.log"
            status=${PIPESTATUS[0]}
            cat "$RUNNER_TEMP/g1-o1-sample-$sample.log" >> "$RUNNER_TEMP/runtime-flow-profile.log"
            if [ "$status" -ne 0 ] || ! grep -q 'phase-1g-candidate-proof: passed' "$RUNNER_TEMP/g1-o1-sample-$sample.log"; then failed=1; fi
          done
          test "$failed" -eq 0
      - name: Upload flow profile
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase-1g-flow-profile-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/runtime-flow-profile.log
            ${{ runner.temp }}/runtime-flow.json
            ${{ runner.temp }}/observed-*.log
            ${{ runner.temp }}/observed-branches.png
          if-no-files-found: error
          retention-days: 7

  thinking-settings:
    if: ${{ !inputs.validation_dummy && (!inputs.studio_connection_native && (github.event_name == 'workflow_dispatch' && !inputs.harness_regressions && inputs.thinking_settings)) }}
    uses: ./.github/workflows/thinking-settings.yml
    with:
      candidate: ${{ inputs.thinking_settings_candidate }}
      ordinal: ${{ inputs.thinking_settings_ordinal }}

  validation-dummy:
    name: Dummy qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_dummy }}
    needs: validation-start
    uses: ./.github/workflows/validation-dummy.yml
    with:
      result: ${{ inputs.validation_dummy_result }}

  validation-start:
    name: Validation status (start)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    uses: ./.github/workflows/validation-status.yml

  validation-finish:
    name: Validation status (finish)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [code-checks, studio-connection-native, harness-regressions, validate, phase1g-flow-profile, thinking-settings, validation-dummy, validation-start]
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    uses: ./.github/workflows/validation-status.yml
    with:
      phase: finish
