name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      phase1g_flow_profile:
        description: Run the bounded Phase 1G flow profiler instead of repository quality
        required: false
        type: boolean
        default: false
      phase1g_candidate_proof:
        description: Select G1-O1 safety and three fixed feasibility samples (requires flow profile)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.phase1g_flow_profile }}
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate repository structure, links, privacy, and secrets
        run: python3 scripts/validate.py


  phase1g-flow-profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase1g_flow_profile }}
    name: Phase 1G flow profile — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: phase-1b-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: "false"
      - name: Profile isolated Branches projection
        if: ${{ !inputs.phase1g_candidate_proof }}
        shell: bash
        env:
          LOOMLIGHT_PROFILE_FLOW: "1"
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked scene::tests::flow_budget_fixture_500_scenes_2000_edges -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/runtime-flow-profile.log"
          grep 'phase-1g-flow-profile:' "$RUNNER_TEMP/runtime-flow-profile.log"
      - name: Prove isolated verified candidates
        if: ${{ inputs.phase1g_candidate_proof }}
        shell: bash
        env:
          LOOMLIGHT_ENFORCE_FLOW_BUDGETS: "1"
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -Vv
            if [ "$RUNNER_OS" = "Windows" ]; then
              powershell -NoProfile -Command 'Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture; Get-Volume | Select-Object DriveLetter,FileSystemType'
            else
              sw_vers
              df "$RUNNER_TEMP"
              diskutil info /
            fi
            cargo test -p loomlight-core --release --locked g1_o1 -- --skip g1_o1_feasibility --test-threads=1 --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/runtime-flow-profile.log"
          safety=${PIPESTATUS[0]}
          if [ "$safety" -ne 0 ]; then exit "$safety"; fi
          set +e
          failed=0
          for sample in 1 2 3; do
            echo "g1-o1-sample: $sample" | tee -a "$RUNNER_TEMP/runtime-flow-profile.log"
            cargo test -p loomlight-core --release --locked scene::tests::candidate_proof::g1_o1_feasibility -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/g1-o1-sample-$sample.log"
            status=${PIPESTATUS[0]}
            cat "$RUNNER_TEMP/g1-o1-sample-$sample.log" >> "$RUNNER_TEMP/runtime-flow-profile.log"
            if [ "$status" -ne 0 ] || ! grep -q 'phase-1g-candidate-proof: passed' "$RUNNER_TEMP/g1-o1-sample-$sample.log"; then failed=1; fi
          done
          test "$failed" -eq 0
      - name: Upload flow profile
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-1g-flow-profile-${{ matrix.runner }}
          path: ${{ runner.temp }}/runtime-flow-profile.log
          if-no-files-found: error
          retention-days: 7
