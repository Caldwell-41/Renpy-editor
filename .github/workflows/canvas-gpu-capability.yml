name: Canvas GPU capability

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact reviewed L17 capability candidate SHA
        type: string
        required: true
      ordinal:
        description: Cumulative L17 dispatch ordinal
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: canvas-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-capability:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected candidate and seventh dispatch
        env:
          CANDIDATE: ${{ inputs.candidate }}
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/phase3b-screen-designer
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ORDINAL" = 7
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/canvas-gpu"
          git rev-parse HEAD > "$RUNNER_TEMP/canvas-gpu/candidate.txt"
          python ../spikes/canvas-gpu/probe.py --check
      - name: Compile the disposable Windows owner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x64 compiler is required' }
          $setup = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $source = (Resolve-Path '../spikes/canvas-gpu/windows-owner.c').Path
          $owner = "$env:RUNNER_TEMP\canvas-gpu\windows-owner.exe"
          $object = "$env:RUNNER_TEMP\canvas-gpu\windows-owner.obj"
          & cmd.exe /d /s /c "`"`"$setup`" && cl /nologo /std:c17 /W4 /WX /O2 `"$source`" /Fo`"$object`" /Fe`"$owner`" user32.lib`""
          if ($LASTEXITCODE -ne 0) { throw 'Capability owner compilation failed' }
          Get-FileHash $owner | Select-Object Algorithm,Hash | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/canvas-gpu/owner-identity.json"
      - name: Provision the disposable CI desktop
        shell: pwsh
        run: ./scripts/prepare-canvas-display.ps1 -Output "$env:RUNNER_TEMP/canvas-gpu/display.json"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-Windows-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Verify official pinned SDK
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 --output "$RUNNER_TEMP/canvas-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.sdk-cache.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
          python scripts/verify-help-sdk.py "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" "$RUNNER_TEMP/canvas-checksums.txt"
      - name: Short isolated SDK path
        shell: pwsh
        run: |
          $scratch = 'C:\llgpu7'
          if (Test-Path $scratch) { throw 'Capability scratch root already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TEMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Two Windows SDK launches for hidden GPU rendering, stop and refusal
        run: |
          python ../spikes/canvas-gpu/probe.py --owner "$RUNNER_TEMP/canvas-gpu/windows-owner.exe" --archive "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" --output "$RUNNER_TEMP/canvas-gpu/probe"
      - name: Scan complete or partial public evidence
        id: privacy
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/canvas-gpu"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/canvas-gpu"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.privacy.outcome == 'success' }}
        with:
          name: canvas-gpu-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canvas-gpu/
          if-no-files-found: error
          retention-days: 7
