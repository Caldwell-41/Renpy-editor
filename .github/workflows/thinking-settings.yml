name: Thinking settings qualification
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact reviewed commit SHA
        required: true
        type: string
      ordinal:
        description: Cumulative paired attempt (1 or 2)
        default: '1'
        type: choice
        options: ['1', '2']
permissions:
  contents: read
concurrency:
  group: thinking-settings-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      RUSTUP_TOOLCHAIN: 1.90.0
      EXPECTED_CANDIDATE: ${{ inputs.candidate }}
      ATTEMPT_ORDINAL: ${{ inputs.ordinal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact candidate and attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ATTEMPT_ORDINAL" = 1 -o "$ATTEMPT_ORDINAL" = 2
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app -> target
          key: thinking-settings-${{ matrix.runner }}
          cache-bin: 'false'
      - name: Focused renderer and service regressions
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thinking-settings"
          npm install --global npm@11.9.0
          test "$(npm --version)" = 11.9.0
          npm ci --ignore-scripts
          npm run typecheck > "$RUNNER_TEMP/thinking-settings/typecheck.log" 2>&1
          npm run build:tests > "$RUNNER_TEMP/thinking-settings/test-compile.log" 2>&1
          node --test --test-concurrency=1 --test-reporter=tap dist-tests/tests/ai-settings.dom.test.js dist-tests/tests/rewrite-ui.dom.test.js dist-tests/tests/prompt-ui.dom.test.js dist-tests/tests/studio-request.dom.test.js dist-tests/tests/protocol.test.js > "$RUNNER_TEMP/thinking-settings/dom.log" 2>&1
          python -c "import os,pathlib,re; s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'thinking-settings/dom.log').read_text(encoding='utf-8'); assert re.search(r'^# tests 51$',s,re.M) and re.search(r'^# pass 51$',s,re.M) and re.search(r'^# fail 0$',s,re.M) and re.search(r'^# skipped 0$',s,re.M)"
          npm run build > "$RUNNER_TEMP/thinking-settings/renderer-build.log" 2>&1
          node node_modules/playwright/cli.js install chromium
          export LOOMLIGHT_UI_OUTPUT="$RUNNER_TEMP/thinking-settings/browser"
          export LOOMLIGHT_UI_SURFACES=settings
          node tests/walkthrough-redesign.browser.mjs > "$RUNNER_TEMP/thinking-settings/browser.log" 2>&1
          python -c "import os,json,pathlib; p=pathlib.Path(os.environ['LOOMLIGHT_UI_OUTPUT']); v=json.loads((p/'metrics.json').read_text(encoding='utf-8')); assert len(v['receipts'])==4 and not v['errors'] and not v['prohibited']; assert v['inputIdentity']['unchanged'] and v['cleanup']=={'browser':'closed','server':'closed'}; assert all(not r['viewportOverflow'] and r['actionsVisible'] for r in v['receipts'])"
          rustup toolchain install 1.90.0 --profile minimal
          python -m unittest discover -s scripts -p test_check_thinking_evidence.py -v > "$RUNNER_TEMP/thinking-settings/gate-tests.log" 2>&1
          for scope in ai_profiles::tests:: ai_credentials::tests:: ai_compatibility::tests:: thinking_ connection_; do
            name="${scope//::/-}"
            cargo test -p loomlight-core --locked --lib "$scope" -- --list > "$RUNNER_TEMP/thinking-settings/$name-list.log" 2>&1
            cargo test -p loomlight-core --locked --lib "$scope" -- --nocapture > "$RUNNER_TEMP/thinking-settings/$name.log" 2>&1
            python scripts/check-thinking-evidence.py "$RUNNER_TEMP/thinking-settings/$name-list.log" "$RUNNER_TEMP/thinking-settings/$name.log"
          done
          cargo test -p loomlight-core --locked --lib ai_request::tests:: -- --list > "$RUNNER_TEMP/thinking-settings/request-list.log" 2>&1
          cargo test -p loomlight-core --locked --lib ai_request::tests:: -- --nocapture > "$RUNNER_TEMP/thinking-settings/request.log" 2>&1
          python scripts/check-thinking-evidence.py "$RUNNER_TEMP/thinking-settings/request-list.log" "$RUNNER_TEMP/thinking-settings/request.log"
          for scope in ai_requests::tests:: ai_settings::tests:: ai_connection::tests::; do
            name="${scope//::/-}"
            cargo test -p loomlight-desktop --locked --bin loomlight "$scope" -- --list > "$RUNNER_TEMP/thinking-settings/$name-list.log" 2>&1
            cargo test -p loomlight-desktop --locked --bin loomlight "$scope" -- --nocapture > "$RUNNER_TEMP/thinking-settings/$name.log" 2>&1
            python scripts/check-thinking-evidence.py "$RUNNER_TEMP/thinking-settings/$name-list.log" "$RUNNER_TEMP/thinking-settings/$name.log"
          done
          git diff --exit-code HEAD -- . ../.github/workflows
      - name: Seal exact-candidate evidence
        id: seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'thinking-settings';p.mkdir(exist_ok=True)
          candidate=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tracked=subprocess.check_output(['git','ls-files','app','.github/workflows/thinking-settings.yml'],text=True).splitlines()
          inputs={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in tracked}
          (p/'identity.json').write_text(json.dumps({'candidate':candidate,'expectedCandidate':os.environ['EXPECTED_CANDIDATE'],'machine':platform.machine(),'inputs':inputs},indent=2)+'\n',encoding='utf-8')
          (p/'manifest.json').write_text(json.dumps({f.relative_to(p).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and f!=p/'manifest.json'},indent=2)+'\n',encoding='utf-8')
          PY
          node app/scripts/scan-artifacts.mjs "$RUNNER_TEMP/thinking-settings"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.seal.outcome == 'success' }}
        with:
          name: thinking-settings-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thinking-settings
          retention-days: 7
