name: Thinking settings qualification
on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      ordinal:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact reviewed commit SHA
        required: true
        type: string
      ordinal:
        description: Cumulative paired attempt (1 or 2)
        default: '1'
        type: choice
        options: ['1', '2']
permissions:
  contents: read
concurrency:
  group: thinking-settings-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      RUSTUP_TOOLCHAIN: 1.90.0
      EXPECTED_CANDIDATE: ${{ inputs.candidate }}
      ATTEMPT_ORDINAL: ${{ inputs.ordinal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact candidate and attempt
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.version_info >= (3,11)"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ATTEMPT_ORDINAL" = 1 -o "$ATTEMPT_ORDINAL" = 2
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          python -c "import os,platform; expected='arm64' if os.environ['RUNNER_OS']=='macOS' else 'amd64'; assert platform.machine().lower()==expected, platform.machine()"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app -> target
          key: thinking-settings-${{ matrix.runner }}
          cache-bin: 'false'
      - name: Focused renderer and service regressions
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thinking-settings"
          npm install --global npm@11.9.0
          npm_cli="$(npm root --global)/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = 11.9.0
          node "$npm_cli" ci --ignore-scripts
          node "$npm_cli" run typecheck > "$RUNNER_TEMP/thinking-settings/typecheck.log" 2>&1
          node "$npm_cli" run build:tests > "$RUNNER_TEMP/thinking-settings/test-compile.log" 2>&1
          node --test --test-concurrency=1 --test-reporter=tap dist-tests/tests/*.test.js tests/branches-timing-policy.test.mjs > "$RUNNER_TEMP/thinking-settings/dom.log" 2>&1
          python scripts/check-thinking-evidence.py dom "$RUNNER_TEMP/thinking-settings/dom.log"
          node "$npm_cli" run build > "$RUNNER_TEMP/thinking-settings/renderer-build.log" 2>&1
          node node_modules/playwright/cli.js install chromium
          export LOOMLIGHT_UI_OUTPUT="$RUNNER_TEMP/thinking-settings/browser"
          export LOOMLIGHT_UI_SURFACES=settings
          node tests/walkthrough-redesign.browser.mjs > "$RUNNER_TEMP/thinking-settings/browser.log" 2>&1
          python scripts/check-thinking-evidence.py browser "$LOOMLIGHT_UI_OUTPUT"
          rustup toolchain install 1.90.0 --profile minimal
          cargo test -p loomlight-core --locked --lib --no-run --message-format=json > "$RUNNER_TEMP/thinking-settings/core-artifacts.jsonl" 2> "$RUNNER_TEMP/thinking-settings/core-compile.log"
          cargo test -p loomlight-desktop --locked --bin loomlight --no-run --message-format=json > "$RUNNER_TEMP/thinking-settings/desktop-artifacts.jsonl" 2> "$RUNNER_TEMP/thinking-settings/desktop-compile.log"
          python -m unittest discover -s scripts -p 'test_*.py' -v > "$RUNNER_TEMP/thinking-settings/gate-tests.log" 2>&1
          python scripts/check-q1-prep-gates.py self-test > "$RUNNER_TEMP/thinking-settings/q1-gate-tests.log" 2>&1
          python scripts/check-q1-prep-gates.py source-audit .. > "$RUNNER_TEMP/thinking-settings/q1-source-audit.log" 2>&1
          python scripts/test-q1-package-retention.py > "$RUNNER_TEMP/thinking-settings/retention-tests.log" 2>&1
          for scope in ai_profiles::tests:: ai_credentials::tests:: ai_compatibility::tests:: thinking_ connection_; do
            name="${scope//::/-}"
            cargo test -p loomlight-core --locked --lib "$scope" -- --list > "$RUNNER_TEMP/thinking-settings/$name-list.log" 2>&1
            cargo test -p loomlight-core --locked --lib "$scope" -- --nocapture > "$RUNNER_TEMP/thinking-settings/$name.log" 2>&1
            python scripts/check-thinking-evidence.py cargo "$RUNNER_TEMP/thinking-settings/$name-list.log" "$RUNNER_TEMP/thinking-settings/$name.log"
          done
          cargo test -p loomlight-core --locked --lib ai_request::tests:: -- --list > "$RUNNER_TEMP/thinking-settings/request-list.log" 2>&1
          cargo test -p loomlight-core --locked --lib ai_request::tests:: -- --nocapture > "$RUNNER_TEMP/thinking-settings/request.log" 2>&1
          python scripts/check-thinking-evidence.py cargo "$RUNNER_TEMP/thinking-settings/request-list.log" "$RUNNER_TEMP/thinking-settings/request.log"
          cargo test -p loomlight-desktop --locked --bin loomlight -- --list > "$RUNNER_TEMP/thinking-settings/desktop-list.log" 2>&1
          cargo test -p loomlight-desktop --locked --bin loomlight -- --nocapture > "$RUNNER_TEMP/thinking-settings/desktop.log" 2>&1
          python scripts/check-thinking-evidence.py cargo "$RUNNER_TEMP/thinking-settings/desktop-list.log" "$RUNNER_TEMP/thinking-settings/desktop.log"
          git diff --exit-code HEAD -- . ../.github/workflows
      - name: Retain available compiled tests including failed attempts
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/thinking-settings"
          python app/scripts/check-thinking-evidence.py retain "$RUNNER_TEMP/thinking-settings" app/target > "$RUNNER_TEMP/thinking-settings/binary-retention.log" 2>&1
      - name: Seal exact-candidate evidence
        id: seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thinking-settings"
          python app/scripts/check-thinking-evidence.py seal "$RUNNER_TEMP/thinking-settings" .
          node app/scripts/scan-artifacts.mjs "$RUNNER_TEMP/thinking-settings"
      - name: Require complete current source and retained compiled tests
        if: success()
        shell: bash
        run: python app/scripts/check-thinking-evidence.py identity "$RUNNER_TEMP/thinking-settings/identity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.seal.outcome == 'success' }}
        with:
          name: thinking-settings-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thinking-settings
          if-no-files-found: error
          retention-days: 7
