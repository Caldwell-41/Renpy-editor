name: Materialize validated Phase 1C remediation

on:
  push:
    branches: [phase-1c-crash-consistency]
    paths:
      - .github/workflows/materialize-phase-1c.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-1c-crash-consistency
          fetch-depth: 0
      - name: Materialize the exact supported-target candidate
        run: |
          python3 scripts/apply_phase1c_remediation.py
          python3 scripts/apply_phase1c_fixups.py
          python3 scripts/apply_phase1c_target_fixups.py
          python3 scripts/apply_phase1c_overlay_fixups.py
          python3 scripts/apply_phase1c_overlay_crossplatform_fixups.py
          python3 scripts/apply_phase1c_finalization_fixups.py
          python3 scripts/apply_phase1c_renpy_fd_fixups.py
          python3 scripts/apply_phase1c_cleanup_fixups.py
          cd app
          cargo fmt --all
          cargo fmt --check --all
          cargo test -p loomlight-core --locked
          rustup component add clippy
          cargo clippy -p loomlight-core --all-targets --locked -- -D warnings
          cd ..
          git diff --check
      - name: Remove temporary remediation machinery
        run: |
          git rm -f \
            .github/phase-1c-remediate.patch \
            .github/workflows/phase-1c-remediation-check.yml \
            .github/workflows/materialize-phase-1c.yml \
            scripts/apply_phase1c_remediation.py \
            scripts/apply_phase1c_fixups.py \
            scripts/apply_phase1c_target_fixups.py \
            scripts/apply_phase1c_overlay_fixups.py \
            scripts/apply_phase1c_overlay_crossplatform_fixups.py \
            scripts/apply_phase1c_finalization_fixups.py \
            scripts/apply_phase1c_renpy_fd_fixups.py \
            scripts/apply_phase1c_cleanup_fixups.py
          python3 scripts/validate.py
          git diff --check
      - name: Commit validated production source
        run: |
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add app/src-core/src/lifecycle.rs app/src-core/src/renpy.rs app/src-core/src/transaction/mod.rs
          git status --short
          git commit -m "fix: harden Phase 1C crash consistency" \
            -m "Embed managed SDK provenance before promotion, recover interrupted installer states without destructive cleanup, atomically replace Recent Projects, and keep project generation/finalisation on retained filesystem authority."
          git push origin HEAD:phase-1c-crash-consistency
