name: Matched canvas rendering

on:
  workflow_call:
    inputs:
      candidate:
        description: Exact reviewed candidate SHA
        type: string
        required: true
      ordinal:
        description: Cumulative L17 dispatch ordinal
        type: string
        required: true

permissions:
  contents: read

jobs:
  comparison:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.90.0
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected candidate and allowance
        env:
          CANDIDATE: ${{ inputs.candidate }}
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/phase3b-screen-designer
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ORDINAL" = 13
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/canvas-comparison"
          git rev-parse HEAD > "$RUNNER_TEMP/canvas-comparison/candidate.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: canvas-helper-windows
          workspaces: app -> target
          cache-bin: 'false'
      - name: Pinned tools and typechecking
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          npm install --global npm@11.9.0
          npm ci
          python -m pip install Pillow==12.3.0
          npm run typecheck
      - name: Build and check the production connection
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked --lib --no-run --message-format=json > "$RUNNER_TEMP/canvas-comparison/core-build.jsonl"
          cargo build -p loomlight-core --release --example canvas-controller-driver --locked --message-format=json > "$RUNNER_TEMP/canvas-comparison/driver-build.jsonl"
          cargo test -p loomlight-core --release --locked --lib screens::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/canvas-comparison/screens-tests.log"
      - name: Provision and verify matched-reference desktop
        shell: pwsh
        run: ./scripts/prepare-canvas-display.ps1 -Output "$env:RUNNER_TEMP/canvas-comparison/display.json"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-Windows-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Verify official pinned SDK
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 --output "$RUNNER_TEMP/canvas-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.sdk-cache.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
          python scripts/verify-help-sdk.py "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" "$RUNNER_TEMP/canvas-checksums.txt"
      - name: Short fresh scratch root
        shell: pwsh
        run: |
          $scratch = "C:\llmatch${{ inputs.ordinal }}"
          if (Test-Path $scratch) { throw 'Matched-rendering scratch root already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TEMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Capture four production frames with one helper
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_CANVAS_EVIDENCE: ${{ runner.temp }}/canvas-comparison/helper
        run: node tests/canvas-matched-capture.mjs
      - name: Deliberate accepted-screen reference with one SDK process
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_CANVAS_EVIDENCE: ${{ runner.temp }}/canvas-comparison/reference
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked --lib lifecycle::runtime_tests::canvas_reference_sdk_captures_actual_screen_at_two_internal_aspects -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/canvas-comparison/reference.log"
      - name: Require matching inputs, geometry and exact RGBA pixels
        run: python scripts/compare-canvas-rendering.py "$RUNNER_TEMP/canvas-comparison/helper" "$RUNNER_TEMP/canvas-comparison/reference" "$RUNNER_TEMP/canvas-comparison/comparison"
      - name: Retain produced binaries and toolchain identity after success or failure
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, shutil, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'canvas-comparison'
          binaries = output / 'binaries'
          binaries.mkdir(parents=True, exist_ok=True)
          manifest = {'candidate': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                      'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'machine': platform.machine(), 'builds': []}
          manifest['tools'] = {}
          for name, command in [('rust', ['rustc', '--version']), ('node', ['node', '--version']), ('python', ['python', '--version'])]:
              try:
                  manifest['tools'][name] = subprocess.check_output(command, text=True).strip()
              except (OSError, subprocess.CalledProcessError):
                  manifest['tools'][name] = 'unavailable'
          for name in ['core-build.jsonl', 'driver-build.jsonl']:
              entry = {'stream': name, 'state': 'not-compiled', 'executables': []}
              stream = output / name
              for line in stream.read_text().splitlines() if stream.exists() else []:
                  try:
                      record = json.loads(line)
                  except json.JSONDecodeError:
                      entry['incompleteStream'] = True
                      continue
                  if record.get('reason') != 'compiler-artifact' or not record.get('executable'):
                      continue
                  source = pathlib.Path(record['executable']).resolve()
                  assert source.is_relative_to(pathlib.Path('target').resolve())
                  if not source.is_file():
                      entry['executables'].append({'name': source.name, 'state': 'unavailable'})
                      continue
                  try:
                      destination = binaries / source.name
                      shutil.copyfile(source, destination)
                      entry['executables'].append({'name': source.name, 'state': 'retained', 'sha256': hashlib.sha256(destination.read_bytes()).hexdigest()})
                  except OSError as error:
                      entry['executables'].append({'name': source.name, 'state': 'retention-failed', 'error': str(error)})
              if entry['executables']:
                  entry['state'] = 'compiled'
              manifest['builds'].append(entry)
          (output / 'binary-identity.json').write_text(json.dumps(manifest, indent=2) + '\n')
          assert all(e['state'] == 'retained' for b in manifest['builds'] for e in b['executables'])
          PY
      - name: Scan retained public fixture evidence
        id: privacy
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/canvas-comparison"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/canvas-comparison"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.privacy.outcome == 'success' }}
        with:
          name: canvas-comparison-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canvas-comparison/
          if-no-files-found: error
          retention-days: 7
