name: Phase 1C legacy provenance correction

on:
  push:
    branches: [phase-1c-network-install-fix]
    paths:
      - scripts/apply_phase1c_legacy_provenance_fix.py
      - .github/workflows/phase-1c-legacy-provenance-fix.yml

permissions:
  contents: write

jobs:
  target-check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply candidate provenance correction
        shell: bash
        run: python3 scripts/apply_phase1c_legacy_provenance_fix.py
      - name: Validate core
        shell: bash
        working-directory: app
        run: |
          cargo fmt --all
          cargo fmt --check --all
          cargo test -p loomlight-core --locked
      - name: Restore pinned Ren'Py SDK archive
        id: phase-1c-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-legacy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Download pinned official Ren'Py SDK on cache miss
        if: steps.phase-1c-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
      - name: Exercise complete Phase 1C target gate
        shell: bash
        working-directory: app
        env:
          LOOMLIGHT_PHASE1C_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked \
            lifecycle::tests::official_sdk_phase_1c_target_gate -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/phase-1c-legacy-provenance.log"
          grep 'phase-1c-target-gate: passed' "$RUNNER_TEMP/phase-1c-legacy-provenance.log"
      - name: Bound candidate diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'app/src-core/src/lifecycle.rs\napp/src-core/src/renpy.rs'

  materialize:
    needs: target-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-1c-network-install-fix
          fetch-depth: 0
      - name: Materialize tested provenance correction
        run: |
          python3 scripts/apply_phase1c_legacy_provenance_fix.py
          cd app
          cargo fmt --all
          cargo fmt --check --all
          cargo test -p loomlight-core --locked
          rustup component add clippy
          cargo clippy -p loomlight-core --all-targets --locked -- -D warnings
          cd ..
          git diff --check
      - name: Remove temporary correction machinery
        run: |
          git rm -f scripts/apply_phase1c_legacy_provenance_fix.py .github/workflows/phase-1c-legacy-provenance-fix.yml
          python3 scripts/validate.py
          git diff --check
      - name: Commit final correction
        run: |
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add app/src-core/src/renpy.rs app/src-core/src/lifecycle.rs
          git commit -m "fix: recover interrupted SDK provenance migration"
          git push origin HEAD:phase-1c-network-install-fix
