name: Phase 1C corrective documentation finalize

on:
  push:
    branches: [phase1c-corrective-closure]
    paths:
      - .github/workflows/phase1c-docs-closure-fix.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective-closure
          fetch-depth: 0

      - name: Apply validated closure reconciliation
        shell: bash
        run: |
          git mv docs/tasks/active/phase-1c-corrective-lifecycle.md docs/tasks/archive/2026-09-14-phase-1c-corrective-lifecycle.md
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase1c-docs-closure.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Validate documentation"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'phase1c-docs-closure', 'exec'))

          index = Path('docs/INDEX.md')
          index.write_text(index.read_text().rstrip() + '\n')

          archive = Path('docs/tasks/archive/2026-09-14-phase-1c-corrective-lifecycle.md')
          text = archive.read_text().replace(
              '**Status:** Complete 2026-09-14  \n',
              '**Status:** Complete 2026-09-14\n',
              1,
          )
          archive.write_text(text)
          PY

      - name: Validate documentation
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit closure documentation
        shell: bash
        run: |
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add AGENTS.md docs
          git status --short
          git commit -m "docs: re-close Phase 1C corrective gate"
          git push origin HEAD:phase1c-corrective-closure
