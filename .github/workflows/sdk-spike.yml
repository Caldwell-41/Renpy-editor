name: Ren'Py 8.5.3 SDK evidence spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sdk-spike.yml
      - spikes/renpy-sdk/**
      - tests/fixtures/crossroads-at-sundown/**

permissions:
  contents: read

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDK_ARCHIVE: renpy-8.5.3-sdk.tar.bz2
      SDK_SHA256: eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download official metadata and SDK
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/checksums.txt" \
            https://www.renpy.org/dl/8.5.3/checksums.txt
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/$SDK_ARCHIVE.partial" \
            "https://www.renpy.org/dl/8.5.3/$SDK_ARCHIVE"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_ARCHIVE.partial" | sha256sum --check
          mv "$RUNNER_TEMP/$SDK_ARCHIVE.partial" "$RUNNER_TEMP/$SDK_ARCHIVE"
      - name: Probe SDK adapter with explicit fixture trust
        run: |
          xvfb-run -a python3 spikes/renpy-sdk/probe.py \
            --archive "$RUNNER_TEMP/$SDK_ARCHIVE" \
            --checksums "$RUNNER_TEMP/checksums.txt" \
            --fixture tests/fixtures/crossroads-at-sundown \
            --allow-project-execution \
            --output "$RUNNER_TEMP/sdk-probe.json"
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renpy-8.5.3-linux-probe
          path: ${{ runner.temp }}/sdk-probe.json
          if-no-files-found: warn
          retention-days: 7
