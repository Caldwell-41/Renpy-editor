name: Ren'Py 8.5.3 SDK evidence spike

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  target-probe:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 baseline
            runner: ubuntu-latest
            slug: linux-x64
          - name: Windows x64
            runner: windows-2025
            slug: windows-x64
          - name: macOS ARM64
            runner: macos-26
            slug: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      SDK_ARCHIVE: renpy-8.5.3-sdk.tar.bz2
      SDK_SHA256: eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore pinned SDK archive
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/${{ env.SDK_ARCHIVE }}
          key: renpy-sdk-${{ runner.os }}-${{ env.SDK_ARCHIVE }}-${{ env.SDK_SHA256 }}
      - name: Download official checksum metadata
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/checksums.txt" \
            https://www.renpy.org/dl/8.5.3/checksums.txt
      - name: Download official SDK on cache miss
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/$SDK_ARCHIVE.partial" \
            "https://www.renpy.org/dl/8.5.3/$SDK_ARCHIVE"
          mv "$RUNNER_TEMP/$SDK_ARCHIVE.partial" "$RUNNER_TEMP/$SDK_ARCHIVE"
      - name: Verify pinned SDK checksum
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            probe_python=python
          else
            probe_python=python3
          fi
          "$probe_python" -c '
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "spikes/renpy-sdk")
          from archive_safety import verify_sha256

          archive = Path(os.environ["RUNNER_TEMP"]) / os.environ["SDK_ARCHIVE"]
          verify_sha256(archive, os.environ["SDK_SHA256"])
          print(f"{archive.name}: OK")
          '
      - name: Probe SDK adapter with explicit fixture trust
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            probe_prefix=(python)
          elif [ "$RUNNER_OS" = "Linux" ]; then
            probe_prefix=(xvfb-run -a python3)
          else
            probe_prefix=(python3)
          fi
          "${probe_prefix[@]}" spikes/renpy-sdk/probe.py \
            --archive "$RUNNER_TEMP/$SDK_ARCHIVE" \
            --checksums "$RUNNER_TEMP/checksums.txt" \
            --fixture tests/fixtures/crossroads-at-sundown \
            --allow-project-execution \
            --output "$RUNNER_TEMP/sdk-probe-${{ matrix.slug }}.json"
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renpy-8.5.3-${{ matrix.slug }}-probe
          path: ${{ runner.temp }}/sdk-probe-${{ matrix.slug }}.json
          if-no-files-found: warn
          retention-days: 7
