name: Phase 1C Windows Ren'Py setup probe

on:
  push:
    branches: [phase1c-corrective-targets]
    paths:
      - .github/workflows/phase1c-windows-env-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective-targets
      - name: Restore pinned Ren'Py SDK archive
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Download pinned official Ren'Py SDK on cache miss
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
      - name: Reproduce lifecycle SDK and stage sequence
        shell: pwsh
        env:
          SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          PROBE_ROOT: ${{ runner.temp }}/renpy-setup-probe
        run: |
          @'
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile
          import uuid

          archive = pathlib.Path(os.environ["SDK_ARCHIVE"])
          probe = pathlib.Path(os.environ["PROBE_ROOT"])
          shutil.rmtree(probe, ignore_errors=True)
          payload = probe / "payload"
          payload.mkdir(parents=True)
          with tarfile.open(archive, "r:bz2") as tf:
              tf.extractall(payload)
          roots = [p for p in payload.iterdir() if p.is_dir() and (p / "renpy.py").is_file()]
          if len(roots) != 1:
              raise SystemExit(f"unexpected SDK root count: {len(roots)}")

          managed = probe / "managed-state" / "sdks" / "renpy-8.5.3-sdk-verified-v1"
          managed.parent.mkdir(parents=True)
          shutil.move(str(roots[0]), str(managed))

          allowed = {
              "PATH", "HOME", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "SYSTEMROOT",
              "WINDIR", "COMSPEC", "PATHEXT", "TMPDIR", "TEMP", "TMP", "LANG",
              "LC_ALL", "LC_CTYPE", "ALLUSERSPROFILE", "COMMONPROGRAMFILES",
              "COMMONPROGRAMFILES(X86)", "COMMONPROGRAMW6432", "COMPUTERNAME",
              "DRIVERDATA", "HOMEDRIVE", "HOMEPATH", "NUMBER_OF_PROCESSORS", "OS",
              "PROCESSOR_ARCHITECTURE", "PROCESSOR_IDENTIFIER", "PROCESSOR_LEVEL",
              "PROCESSOR_REVISION", "PROGRAMDATA", "PROGRAMFILES", "PROGRAMFILES(X86)",
              "PROGRAMW6432", "PUBLIC", "SESSIONNAME", "SYSTEMDRIVE", "USERDOMAIN",
              "USERDOMAIN_ROAMINGPROFILE", "USERNAME",
          }
          env = {k: v for k, v in os.environ.items() if k in allowed}
          env["GIT_DIR"] = str(probe / "hostile-git-dir")
          env["GIT_OBJECT_DIRECTORY"] = str(probe / "hostile-git-objects")
          sanitized = {k: v for k, v in env.items() if k in allowed}

          def paths(root):
              return (root / "lib" / "py3-windows-x86_64" / "python.exe", root / "renpy.py", root / "gui")

          def run_version(label):
              py, script, _ = paths(managed)
              result = subprocess.run([str(py), str(script), "--version"], cwd=managed,
                                      env=sanitized, text=True, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, timeout=60)
              print(f"{label} version exit={result.returncode} output={result.stdout.strip()[-200:]}")
              if result.returncode != 0:
                  raise SystemExit(f"{label} version failed")

          def generate(label, marker):
              py, script, template = paths(managed)
              stage = probe / "projects" / f".loomlight-stage-{uuid.uuid4()}"
              stage.mkdir(parents=True, exist_ok=False)
              (stage / "game").mkdir()
              if marker:
                  (stage / ".loomlight-stage-owner").write_text("loomlight-project-stage-v1\nprobe\n", encoding="utf-8")
              command = [str(py), str(script), "launcher", "generate_gui", str(stage),
                         "--width", "1920", "--height", "1080", "--template", str(template), "--start"]
              result = subprocess.run(command, cwd=managed, env=sanitized, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
              print(f"{label} generate exit={result.returncode}")
              if result.returncode != 0:
                  print("\n".join(result.stdout.splitlines()[-60:]))
              return result.returncode == 0

          (probe / "projects").mkdir()
          run_version("initial-1")
          run_version("initial-2")
          if not generate("before-rename-marker", True):
              raise SystemExit("generation failed before SDK substitution sequence")

          moved = probe / "moved-managed-sdk"
          shutil.move(str(managed), str(moved))
          managed.mkdir()
          shutil.rmtree(managed)
          shutil.move(str(moved), str(managed))

          run_version("restored-1")
          run_version("restored-2")
          if not generate("after-rename-marker", True):
              raise SystemExit("generation failed after SDK substitution sequence")
          if not generate("after-rename-no-marker", False):
              raise SystemExit("generation failed without marker after SDK substitution sequence")
          print("setup-probe: passed")
          '@ | python -
