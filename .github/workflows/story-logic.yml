name: Phase 3A early conditions and calls
on:
  workflow_call:
    inputs:
      ordinal:
        type: string
        required: true
      excluded_selectors:
        type: boolean
        required: true
permissions:
  contents: read
concurrency:
  group: story-logic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: Windows x64
          - runner: macos-26
            target: macOS ARM64
    name: Story logic — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      STORY_PYTHON: ${{ matrix.runner == 'windows-2025' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected branch, exclusive selector and fresh bounded attempt
        shell: bash
        env:
          ORDINAL: ${{ inputs.ordinal }}
          EXCLUDED: ${{ inputs.excluded_selectors }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/phase3a-story-logic
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXCLUDED" = false
          test "$ORDINAL" = 1 -o "$ORDINAL" = 2 -o "$ORDINAL" = 3
          "$STORY_PYTHON" -c "import platform; assert platform.machine().lower() in ('arm64','aarch64') if platform.system()=='Darwin' else platform.machine().lower() in ('amd64','x86_64')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install pinned renderer dependencies
        shell: bash
        working-directory: app
        run: |
          npm install --global npm@11.9.0
          npm_cli="$(npm root --global)/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = 11.9.0
          node "$npm_cli" ci --ignore-scripts
          printf 'STORY_NPM_CLI=%s\n' "$npm_cli" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: phase3a-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: 'false'
      - name: Select locked Rust and check focused evidence rejecting gates
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          "$STORY_PYTHON" -m unittest discover -s app/scripts -p 'test_story_logic_evidence.py' -v
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Fetch official checksum metadata and pinned SDK on cache miss
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 \
            --output "$RUNNER_TEMP/story-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.sdk-cache.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 \
              --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
      - name: Real dispatch nested edits and actual pinned SDK conditions and call returns
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          "$STORY_PYTHON" app/scripts/qualify-story-logic.py \
            --output "$RUNNER_TEMP/story-logic" \
            --archive "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" \
            --checksums "$RUNNER_TEMP/story-checksums.txt" \
            --ordinal '${{ inputs.ordinal }}'
      - name: Retain actual identity and scan all partial or complete evidence
        id: privacy
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/story-logic"
          git rev-parse HEAD > "$RUNNER_TEMP/story-logic/candidate.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/story-logic/tree.txt"
          "$STORY_PYTHON" app/scripts/check-story-logic-evidence.py seal "$RUNNER_TEMP/story-logic"
          node app/scripts/scan-artifacts.mjs "$RUNNER_TEMP/story-logic"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.privacy.outcome == 'success' }}
        with:
          name: story-logic-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/story-logic/
          if-no-files-found: error
          retention-days: 7
