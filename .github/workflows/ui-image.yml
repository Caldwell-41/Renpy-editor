name: UI image qualification

on:
  workflow_call:
    inputs:
      candidate:
        description: Exact L06 candidate SHA
        type: string
        required: true
      ordinal:
        description: Cumulative L06 dispatch ordinal (1 through 3)
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: ui-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-image:
    name: UI image (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: Windows x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      HARNESS_PYTHON: ${{ matrix.runner == 'windows-2025' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require the exact L06 candidate and cumulative dispatch
        env:
          CANDIDATE: ${{ inputs.candidate }}
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/phase3b-l06-ui-image
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$ORDINAL" in 1|2|3) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/ui-image"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-image/candidate.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ui-image-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: 'false'
      - name: Portable checks and native-probe evidence gate
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          npm install --global npm@11.9.0
          npm ci
          "$HARNESS_PYTHON" -m pip install Pillow==12.3.0
          npm run check
          cargo fmt --all --check
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p test_ui_image_evidence.py -v
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p test_owned_screen_evidence.py -v
          cargo test -p loomlight-core --locked --lib screens::tests -- --nocapture
          cargo build -p loomlight-core --example help-controller-driver --locked
          npm run build
          cargo check -p loomlight-desktop --locked
      - name: Real controller/core and exact packaged-probe rehearsal
        env:
          UI_IMAGE_OUTPUT: ${{ runner.temp }}/ui-image/controller
          UI_IMAGE_PROBE_OUTPUT: ${{ runner.temp }}/ui-image/probe-controller
        run: |
          node tests/ui-image.browser.mjs
          node tests/ui-image-probe-controller.browser.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: runner.os == 'Windows'
        id: image-sdk
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Verify the pinned official SDK
        if: runner.os == 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 --output "$RUNNER_TEMP/image-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.image-sdk.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
          "$HARNESS_PYTHON" scripts/verify-help-sdk.py "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" "$RUNNER_TEMP/image-checksums.txt"
      - name: Short isolated Windows SDK path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scratch = "C:\llimage${{ inputs.ordinal }}"
          if (Test-Path $scratch) { throw 'L06 scratch root already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TEMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Public-core source, both SDK aspects and inert helper (five SDK starts)
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_UI_IMAGE_HELPER_EVIDENCE: ${{ runner.temp }}/ui-image/helper
          LOOMLIGHT_UI_IMAGE_INPUTS: ${{ runner.temp }}/ui-image/inputs
        run: |
          cargo test -p loomlight-core --locked screens::tests::ui_images::ui_image_prepares_sdk_fixture_through_public_requests -- --exact --nocapture
          test -f "$LOOMLIGHT_UI_IMAGE_INPUTS/accepted.json"
          "$HARNESS_PYTHON" scripts/qualify-ui-image.py --archive "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" --checksums "$RUNNER_TEMP/image-checksums.txt" --accepted "$LOOMLIGHT_UI_IMAGE_INPUTS/accepted.json" --output "$RUNNER_TEMP/ui-image/sdk" --allow-fixture-execution
          cargo test -p loomlight-core --locked screens::tests::image_sdk::ui_image_helper_qualifies_assets_sizes_and_typed_pending_images -- --exact --ignored --nocapture
          "$HARNESS_PYTHON" scripts/qualify-ui-image-helper.py "$LOOMLIGHT_UI_IMAGE_HELPER_EVIDENCE"
      - name: Windows package and real WebView keyboard/history/reopen (one session)
        if: runner.os == 'Windows'
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          npm exec -- tauri build --no-bundle -- --locked
          "$HARNESS_PYTHON" scripts/run-runtime-ui-probes.py target/release/loomlight.exe "$RUNNER_TEMP/ui-image/native" ui-image
      - name: Retain Windows x64 package identity
        if: ${{ always() && runner.os == 'Windows' && hashFiles('app/target/release/loomlight.exe') != '' }}
        shell: pwsh
        run: |
          $binary = [IO.File]::ReadAllBytes((Resolve-Path 'target/release/loomlight.exe'))
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Windows x64 executable required' }
          @{ candidate=$env:GITHUB_SHA; architecture='Windows x64'; executableSHA256=(Get-FileHash 'target/release/loomlight.exe').Hash } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/ui-image/package-identity.json" -Encoding utf8
      - name: Scan partial or complete public evidence
        id: numeric-privacy
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ui-image"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/ui-image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.numeric-privacy.outcome == 'success' }}
        with:
          name: ui-image-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-image/
          if-no-files-found: error
          retention-days: 7
