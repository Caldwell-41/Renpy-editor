name: Project font qualification

on:
  workflow_call:
    inputs:
      candidate:
        description: Exact L05 candidate SHA
        type: string
        required: true
      ordinal:
        description: Cumulative L05 dispatch ordinal (1 through 3)
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: project-font-${{ github.ref }}
  cancel-in-progress: false

jobs:
  project-font:
    name: Project font (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: Windows x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      HARNESS_PYTHON: ${{ matrix.runner == 'windows-2025' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require the exact L05 candidate and cumulative dispatch
        env:
          CANDIDATE: ${{ inputs.candidate }}
          ORDINAL: ${{ inputs.ordinal }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/l05-project-fonts
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$ORDINAL" in 1|2|3) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/project-font"
          git rev-parse HEAD > "$RUNNER_TEMP/project-font/candidate.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: project-font-${{ matrix.runner }}
          workspaces: app -> target
          cache-bin: 'false'
      - name: Portable checks and native-probe evidence gate
        id: preflight
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          npm install --global npm@11.9.0
          npm ci
          "$HARNESS_PYTHON" -m pip install Pillow==12.3.0
          npm run check
          cargo fmt --all --check
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p test_project_font_evidence.py -v
          "$HARNESS_PYTHON" -m unittest discover -s scripts -p test_owned_screen_evidence.py -v
          cargo test -p loomlight-core --locked screens::tests::fonts::project_fonts_import_as_typed_assets_with_shared_history_and_reopen -- --exact --nocapture
          cargo test -p loomlight-core --locked --lib screens::tests -- --nocapture
          cargo build -p loomlight-core --example help-controller-driver --locked
          npm run build
          cargo check -p loomlight-desktop --locked
      - name: Real controller/core and exact packaged-probe rehearsal
        id: controller
        env:
          COMPOSITION_OUTPUT: ${{ runner.temp }}/project-font/composition-controller
          UI_IMAGE_OUTPUT: ${{ runner.temp }}/project-font/image-controller
          PROJECT_FONT_OUTPUT: ${{ runner.temp }}/project-font/controller
          PROJECT_FONT_PROBE_OUTPUT: ${{ runner.temp }}/project-font/probe-controller
        run: |
          node tests/project-font.browser.mjs
          node tests/project-font-probe-controller.browser.mjs
          node tests/ui-image.browser.mjs
          node tests/screen-composition.browser.mjs
      - name: Retain the exact failed controller executable
        if: ${{ always() && steps.controller.outcome == 'failure' && hashFiles('app/target/debug/examples/help-controller-driver.exe') != '' }}
        shell: pwsh
        run: |
          Copy-Item 'target/debug/examples/help-controller-driver.exe' "$env:RUNNER_TEMP/project-font/failed-controller-driver.exe"
          @{ candidate=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; executableSHA256=(Get-FileHash 'target/debug/examples/help-controller-driver.exe').Hash } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/project-font/failed-controller-identity.json" -Encoding utf8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: runner.os == 'Windows'
        id: font-sdk
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Verify the pinned official SDK
        if: runner.os == 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 180 --output "$RUNNER_TEMP/font-checksums.txt" https://www.renpy.org/dl/8.5.3/checksums.txt
          if test '${{ steps.font-sdk.outputs.cache-hit }}' != true; then
            curl --proto '=https' --tlsv1.2 --location --fail --show-error --max-time 300 --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
            mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
          fi
          "$HARNESS_PYTHON" scripts/verify-help-sdk.py "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" "$RUNNER_TEMP/font-checksums.txt"
      - name: Short isolated Windows SDK path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scratch = "C:\llfont${{ inputs.ordinal }}"
          if (Test-Path $scratch) { throw 'L05 scratch root already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          "TEMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$scratch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Export accepted public-core font source
        id: accepted-input
        env:
          LOOMLIGHT_PROJECT_FONT_INPUTS: ${{ runner.temp }}/project-font/inputs
        run: |
          cargo test -p loomlight-core --locked screens::tests::fonts::project_font_prepares_sdk_source_through_public_requests -- --exact --nocapture
          test -f "$LOOMLIGHT_PROJECT_FONT_INPUTS/accepted.json"
      - name: Normal pinned SDK entry at both aspects (four SDK starts)
        run: |
          "$HARNESS_PYTHON" scripts/qualify-project-font.py --archive "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2" --checksums "$RUNNER_TEMP/font-checksums.txt" --accepted "$RUNNER_TEMP/project-font/inputs/accepted.json" --output "$RUNNER_TEMP/project-font/sdk" --allow-fixture-execution
      - name: Inert font helper (one SDK/helper start)
        if: ${{ always() && steps.accepted-input.outcome == 'success' }}
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          LOOMLIGHT_PROJECT_FONT_NORMAL: ${{ runner.temp }}/project-font/sdk
          LOOMLIGHT_PROJECT_FONT_HELPER_OUTPUT: ${{ runner.temp }}/project-font/helper
          LOOMLIGHT_PROJECT_FONT_INPUTS: ${{ runner.temp }}/project-font/inputs
        run: |
          cargo test -p loomlight-core --locked screens::tests::font_sdk::project_font_helper_matches_normal_sdk_and_retains_typed_pending_source -- --exact --ignored --nocapture
          "$HARNESS_PYTHON" scripts/qualify-project-font-helper.py "$LOOMLIGHT_PROJECT_FONT_HELPER_OUTPUT" "$LOOMLIGHT_PROJECT_FONT_NORMAL" --audit-rejections
      - name: Windows package and real WebView keyboard/history/reopen (one session)
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.controller.outcome == 'success' }}
        env:
          LOOMLIGHT_RUNTIME_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          npm exec -- tauri build --no-bundle -- --locked
          "$HARNESS_PYTHON" scripts/run-runtime-ui-probes.py target/release/loomlight.exe "$RUNNER_TEMP/project-font/native" project-font
      - name: Retain Windows x64 package identity
        if: ${{ always() && runner.os == 'Windows' && hashFiles('app/target/release/loomlight.exe') != '' }}
        shell: pwsh
        run: |
          Copy-Item 'target/release/loomlight.exe' "$env:RUNNER_TEMP/project-font/loomlight.exe"
          $binary = [IO.File]::ReadAllBytes((Resolve-Path 'target/release/loomlight.exe'))
          $pe = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $pe + 4) -ne 0x8664) { throw 'Windows x64 executable required' }
          @{ candidate=$env:GITHUB_SHA; architecture='Windows x64'; executableSHA256=(Get-FileHash 'target/release/loomlight.exe').Hash } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/project-font/package-identity.json" -Encoding utf8
      - name: Scan partial or complete public evidence
        id: numeric-privacy
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/project-font"
          node scripts/scan-artifacts.mjs "$RUNNER_TEMP/project-font"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.numeric-privacy.outcome == 'success' }}
        with:
          name: project-font-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/project-font/
          if-no-files-found: error
          retention-days: 7
