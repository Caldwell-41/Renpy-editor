name: Phase 1C remediation check

on:
  push:
    branches: [phase-1c-crash-consistency]
    paths:
      - scripts/apply_phase1c_remediation.py
      - scripts/apply_phase1c_fixups.py
      - scripts/apply_phase1c_target_fixups.py
      - scripts/apply_phase1c_overlay_fixups.py
      - .github/workflows/phase-1c-remediation-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply candidate remediation
        shell: bash
        run: |
          python3 scripts/apply_phase1c_remediation.py
          python3 scripts/apply_phase1c_fixups.py
          python3 scripts/apply_phase1c_target_fixups.py
          python3 scripts/apply_phase1c_overlay_fixups.py
      - name: Format transformed Rust
        shell: bash
        working-directory: app
        run: cargo fmt --all
      - name: Compile and run core tests
        shell: bash
        working-directory: app
        run: |
          cargo check -p loomlight-core --tests --locked
          cargo test -p loomlight-core --locked
      - name: Restore pinned Ren'Py SDK archive
        id: phase-1c-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-remediation-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Download pinned official Ren'Py SDK on cache miss
        if: steps.phase-1c-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mv "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2.partial" "$RUNNER_TEMP/renpy-8.5.3-sdk.tar.bz2"
      - name: Exercise corrected Phase 1C target gate
        shell: bash
        working-directory: app
        env:
          LOOMLIGHT_PHASE1C_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: |
          set -o pipefail
          cargo test -p loomlight-core --release --locked \
            lifecycle::tests::official_sdk_phase_1c_target_gate -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/phase-1c-remediation.log"
          grep 'phase-1c-target-gate: passed' "$RUNNER_TEMP/phase-1c-remediation.log"
      - name: Verify transformer changed only bounded files
        shell: bash
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort)" = $'app/src-core/src/lifecycle.rs\napp/src-core/src/renpy.rs\napp/src-core/src/transaction/mod.rs'
