name: Phase 1C remediation check

on:
  push:
    branches: [phase-1c-crash-consistency]
    paths:
      - scripts/apply_phase1c_remediation.py
      - .github/workflows/phase-1c-remediation-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply candidate remediation
        run: python3 scripts/apply_phase1c_remediation.py
      - name: Format transformed Rust
        working-directory: app
        run: cargo fmt --all
      - name: Compile core tests
        working-directory: app
        run: cargo check -p loomlight-core --tests --locked
      - name: Run core tests
        working-directory: app
        run: cargo test -p loomlight-core --locked
      - name: Verify transformer changed only bounded files
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort)" = $'app/src-core/src/lifecycle.rs\napp/src-core/src/renpy.rs'
