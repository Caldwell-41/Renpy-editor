name: Materialize Phase 1C network-install correction

on:
  push:
    branches: [phase-1c-network-install-fix]
    paths:
      - scripts/apply_phase1c_network_fix.py
      - .github/workflows/materialize-phase-1c-network-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-1c-network-install-fix
          fetch-depth: 0
      - name: Apply and validate correction
        run: |
          python3 scripts/apply_phase1c_network_fix.py
          cd app
          cargo fmt --all
          cargo fmt --check --all
          cargo test -p loomlight-core --locked
          rustup component add clippy
          cargo clippy -p loomlight-core --all-targets --locked -- -D warnings
          cd ..
          git diff --check
          test "$(git diff --name-only)" = "app/src-core/src/renpy.rs"
      - name: Remove temporary correction machinery
        run: |
          git rm -f scripts/apply_phase1c_network_fix.py .github/workflows/materialize-phase-1c-network-fix.yml
          python3 scripts/validate.py
          git diff --check
      - name: Commit validated correction
        run: |
          git config user.name Caldwell-41
          git config user.email 255503715+Caldwell-41@users.noreply.github.com
          git add app/src-core/src/renpy.rs
          git commit -m "fix: preserve active SDK download during install"
          git push origin HEAD:phase-1c-network-install-fix
