name: Phase 1C Windows Rust process probe

on:
  push:
    branches: [phase1c-corrective-targets]
    paths:
      - .github/workflows/phase1c-windows-rust-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase1c-corrective-targets
      - name: Restore pinned Ren'Py SDK archive
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
          key: phase-1c-renpy-${{ runner.os }}-8.5.3-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45
      - name: Add temporary Rust integration probe
        shell: bash
        run: |
          mkdir -p src-core/tests
          cat > src-core/tests/windows_process_probe.rs <<'RS'
          use loomlight_core::renpy::{install_verified_archive, ArchiveLimits, RenpyAdapter, SDK_SHA256};
          use std::{ffi::OsString, fs, path::{Path, PathBuf}, process::{Command, Stdio}};
          #[cfg(windows)]
          use std::os::windows::process::CommandExt;

          fn apply_env(command: &mut Command) {
              command.env_clear();
              for key in [
                  "PATH", "HOME", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "SYSTEMROOT",
                  "WINDIR", "COMSPEC", "PATHEXT", "TMPDIR", "TEMP", "TMP", "LANG",
                  "LC_ALL", "LC_CTYPE", "ALLUSERSPROFILE", "COMMONPROGRAMFILES",
                  "COMMONPROGRAMFILES(X86)", "COMMONPROGRAMW6432", "COMPUTERNAME",
                  "DRIVERDATA", "HOMEDRIVE", "HOMEPATH", "NUMBER_OF_PROCESSORS", "OS",
                  "PROCESSOR_ARCHITECTURE", "PROCESSOR_IDENTIFIER", "PROCESSOR_LEVEL",
                  "PROCESSOR_REVISION", "PROGRAMDATA", "PROGRAMFILES", "PROGRAMFILES(X86)",
                  "PROGRAMW6432", "PUBLIC", "SESSIONNAME", "SYSTEMDRIVE", "USERDOMAIN",
                  "USERDOMAIN_ROAMINGPROFILE", "USERNAME",
              ] {
                  if let Some(value) = std::env::var_os(key) { command.env(key, value); }
              }
          }

          fn stage(root: &Path, name: &str) -> PathBuf {
              let path = root.join(name);
              fs::create_dir_all(path.join("game")).unwrap();
              fs::write(path.join(".loomlight-stage-owner"), b"loomlight-project-stage-v1\nprobe\n").unwrap();
              path
          }

          fn direct(sdk: &Path, stage: &Path, flags: bool, piped: bool) -> bool {
              let mut command = Command::new(sdk.join("lib/py3-windows-x86_64/python.exe"));
              apply_env(&mut command);
              command
                  .arg(sdk.join("renpy.py"))
                  .args([OsString::from("launcher"), OsString::from("generate_gui")])
                  .arg(stage)
                  .args([OsString::from("--width"), OsString::from("1920"), OsString::from("--height"), OsString::from("1080"), OsString::from("--template")])
                  .arg(sdk.join("gui"))
                  .arg("--start")
                  .current_dir(sdk)
                  .stdin(Stdio::null());
              if flags { command.creation_flags(0x0000_0200); }
              if piped {
                  command.stdout(Stdio::piped()).stderr(Stdio::piped());
                  let output = command.output().unwrap();
                  eprintln!("direct flags={flags} piped={piped} status={} stdout={} stderr={}",
                      output.status,
                      String::from_utf8_lossy(&output.stdout).lines().rev().take(5).collect::<Vec<_>>().join(" | "),
                      String::from_utf8_lossy(&output.stderr).lines().rev().take(10).collect::<Vec<_>>().join(" | "));
                  output.status.success()
              } else {
                  let status = command.status().unwrap();
                  eprintln!("direct flags={flags} piped={piped} status={status}");
                  status.success()
              }
          }

          #[test]
          fn windows_process_variants() {
              let archive = std::env::var_os("LOOMLIGHT_PHASE1C_SDK_ARCHIVE").expect("archive");
              let temp = tempfile::tempdir().unwrap();
              let sdk_root = temp.path().join("sdk");
              install_verified_archive(Path::new(&archive), SDK_SHA256, &sdk_root, ArchiveLimits::default()).unwrap();
              let sdk = RenpyAdapter::validate_sdk(&sdk_root).unwrap();

              assert!(direct(&sdk.root, &stage(temp.path(), "plain"), false, false), "plain direct failed");
              assert!(direct(&sdk.root, &stage(temp.path(), "group"), true, false), "process-group direct failed");
              assert!(direct(&sdk.root, &stage(temp.path(), "piped"), true, true), "piped direct failed");

              let adapter_stage = stage(temp.path(), "adapter");
              let result = RenpyAdapter::generate_starter(&sdk, &adapter_stage, 1920, 1080);
              eprintln!("adapter result={result:?}");
              assert!(result.is_ok(), "adapter failed");
          }
          RS
      - name: Run Windows Rust process probe
        shell: bash
        env:
          LOOMLIGHT_PHASE1C_SDK_ARCHIVE: ${{ runner.temp }}/renpy-8.5.3-sdk.tar.bz2
        run: cargo test -p loomlight-core --release --locked --test windows_process_probe -- --nocapture
