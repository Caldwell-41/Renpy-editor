<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Loomlight desktop spike</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <strong>Loomlight desktop spike</strong>
      <nav aria-label="Docked panels">
        <button id="toggle-controls" aria-controls="controls" aria-expanded="true">Project panel</button>
        <button id="toggle-inspector" aria-controls="inspector" aria-expanded="true">Inspector</button>
        <button id="toggle-bottom" aria-controls="bottom-panel" aria-expanded="true">Diagnostics</button>
      </nav>
      <span id="runtime" aria-live="polite"></span>
    </header>
    <main id="workspace">
      <section id="controls" class="controls dock-panel" data-dock="left" aria-label="Project controls">
        <label>Project root <input id="root" autocomplete="off" /></label>
        <label>Project file <input id="file" value="game/script.rpy" autocomplete="off" /></label>
        <button id="open">Open and watch</button>
        <button id="save">Save if unchanged</button>
        <button id="sdk">Mock SDK version</button>
        <label>Source line <input id="line" type="number" min="1" value="1" /></label>
        <button id="reveal">Reveal range</button>
      </section>
      <div id="controls-resizer" class="resizer" role="separator" aria-label="Resize project panel" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="420" aria-valuenow="240" tabindex="0"></div>
      <section id="centre" aria-label="Source and local media">
        <div id="editor" aria-label="Ren'Py source editor"></div>
        <section id="media-lab" aria-labelledby="media-heading">
          <h2 id="media-heading">Local media</h2>
          <div id="drop-zone" tabindex="0" role="button" aria-describedby="drop-help">Drop synthetic image, audio, or video files</div>
          <p id="drop-help">Local previews only; files are not uploaded.</p>
          <div id="media-previews" aria-live="polite"></div>
        </section>
      </section>
      <div id="inspector-resizer" class="resizer" role="separator" aria-label="Resize inspector" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="480" aria-valuenow="320" tabindex="0"></div>
      <aside id="inspector" class="dock-panel" data-dock="right" aria-label="Selection inspector">
        <button id="inspector-action">Inspector action</button>
        <pre id="log" aria-live="polite"></pre>
      </aside>
    </main>
    <section id="bottom-panel" class="dock-panel" data-dock="bottom" aria-label="Diagnostics panel">
      <button id="diagnostic-action">Diagnostic action</button>
      <span id="layout-status" role="status">Panels ready</span>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
