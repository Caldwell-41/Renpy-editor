[package]
name = "loomlight-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "loomlight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
tauri-utils = "=2.9.3"
serde_json = "=1.0.151"
json-patch = "=3.0.1"

[dependencies]
loomlight-core = { path = "../src-core" }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.4"
rfd = "=0.15.4"
serde = { version = "=1.0.229", features = ["derive"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAlert", "NSButton", "NSControl", "NSSecureTextField", "NSTextField", "NSView", "NSWindow", "NSResponder"] }
